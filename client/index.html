<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Home Front Solutions</title>
    <meta name="description" content="Home Front Solutions — direct-to-door field sales. Find new fiber, work territories, close deals." />
    <link rel="icon" type="image/png" href="/hfs-logo.png" />
    <meta name="theme-color" content="#0F2A44" />
    <!-- Brand typography: Geist (matches homefrontsolutionsllc.com), loaded non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      // Signal when mapboxgl CDN is ready — no polling needed
      window.__mapboxReady = false;
      window.__mapboxReadyCallbacks = [];
      window.__onMapboxReady = function(cb) {
        // Resolve if the flag is set OR the library is already present — a
        // cached/re-executed script can miss the onload event, leaving the
        // flag false while mapboxgl is fully loaded. Without this fallback the
        // map's token fetch stays queued forever ("Loading map…" hang).
        if (window.__mapboxReady || typeof window.mapboxgl !== "undefined") { cb(); }
        else { window.__mapboxReadyCallbacks.push(cb); }
      };
    </script>
    <!-- defer: load in the background so it never blocks first paint on non-map
         pages; the __onMapboxReady callback pattern above handles readiness. -->
    <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js" onload="window.__mapboxReady=true;window.__mapboxReadyCallbacks.forEach(function(cb){cb();});window.__mapboxReadyCallbacks=[];"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
