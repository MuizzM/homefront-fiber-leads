<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the knock sheet hugs the bottom edge and pads itself
         with env(safe-area-inset-bottom) on notched phones. No maximum-scale /
         user-scalable=no: blocking pinch-zoom fails WCAG 2.2 AA (1.4.4 Resize
         Text). iOS focus-zoom is prevented instead by ≥16px form controls (CSS).
         interactive-widget=resizes-content: Android Chrome resizes the layout
         when the keyboard opens, so a form's ZIP field + submit button stay
         visible while typing instead of hiding under the keyboard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Home Front Solutions</title>
    <meta name="description" content="Home Front Solutions team portal — field map, leads, and territory management." />
    <link rel="icon" type="image/png" href="/hfs-logo.png" />
    <!-- Matches the dark ink app background (--background 216 22% 6%) so the
         browser chrome / notch area blends with the translucent status bar. -->
    <meta name="theme-color" content="#0C0F13" />
    <!-- PWA: installable on mobile home screens, standalone launch, iOS ATHS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeFront" />
    <script>
      // Apply saved theme before paint to avoid a flash (dark is the default).
      (function () {
        try {
          var t = localStorage.getItem('hfs-theme');
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <!-- Fonts are self-hosted (@fontsource-variable/geist, bundled by Vite) — no
         Google Fonts requests. The latin subset is preloaded by a build plugin
         (vite.config.ts) because its @font-face rule lives inside the stylesheet
         and would otherwise be discovered a round trip late. Mapbox GL (~230KB
         gz + CSS) is the only third-party origin and is LAZY-loaded (see below):
         login + the entire rep flow never download it. -->
    <!-- ONE preconnect, deliberately without crossorigin. Browsers pool
         connections separately by CORS mode, and every request this app makes
         to api.mapbox.com is no-CORS: the lazy loader below injects the Mapbox
         script and stylesheet as plain elements with no crossorigin attribute,
         and the library's own tile/style fetches follow. The second,
         crossorigin preconnect opened a connection nothing ever used. -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <script>
      // ── Lazy Mapbox loader ───────────────────────────────────────────────────
      // Mapbox GL used to load on EVERY page (login, Today, Leads…) even though
      // only the admin/scan map screens use it. Now the library + CSS are injected
      // on the FIRST call to window.__onMapboxReady(cb) / window.__loadMapbox() —
      // so a session that never opens a map screen never pays the ~230KB. The
      // __onMapboxReady(cb) contract is unchanged for existing callers.
      (function () {
        var V = "https://api.mapbox.com/mapbox-gl-js/v3.3.0/";
        window.__mapboxReady = false;
        window.__mapboxReadyCallbacks = [];
        window.__loadMapbox = function () {
          if (window.__mapboxLoading || window.__mapboxReady || typeof window.mapboxgl !== "undefined") return;
          window.__mapboxLoading = true;
          if (!document.getElementById("mapbox-css")) {
            var css = document.createElement("link");
            css.id = "mapbox-css"; css.rel = "stylesheet"; css.href = V + "mapbox-gl.css";
            document.head.appendChild(css);
          }
          var js = document.createElement("script");
          js.src = V + "mapbox-gl.js"; js.async = true;
          js.onload = function () {
            window.__mapboxReady = true;
            window.__mapboxReadyCallbacks.forEach(function (cb) { cb(); });
            window.__mapboxReadyCallbacks = [];
          };
          // FAILURE IS A STATE, NOT SILENCE. Without this the callback simply
          // never fired on a blocked CDN, a captive portal or a dropped LTE
          // fetch — the map screen was left with no spinner, no error and no
          // retry, forever, on the primary screen of the app. Callbacks are
          // invoked WITH an error so the caller can render its own failure UI.
          js.onerror = function () {
            window.__mapboxLoading = false;
            window.__mapboxFailed = true;
            var err = new Error("mapbox-gl failed to load");
            window.__mapboxReadyCallbacks.forEach(function (cb) { cb(err); });
            window.__mapboxReadyCallbacks = [];
          };
          document.head.appendChild(js);
        };
        window.__onMapboxReady = function (cb) {
          // Already present (cached / re-exec) → resolve immediately; else queue
          // the callback AND kick off the lazy load.
          if (window.__mapboxReady || typeof window.mapboxgl !== "undefined") { cb(); return; }
          if (window.__mapboxFailed) { cb(new Error("mapbox-gl failed to load")); return; }
          window.__mapboxReadyCallbacks.push(cb);
          window.__loadMapbox();
        };
        // Clears the failure latch so a "Retry" affordance can genuinely retry.
        window.__retryMapbox = function () {
          window.__mapboxFailed = false;
          window.__mapboxLoading = false;
          window.__loadMapbox();
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
