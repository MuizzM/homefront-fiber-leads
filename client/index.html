<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>HomeFront Fiber — Field Sales Intelligence</title>
    <meta name="description" content="Identify new Kinetic fiber deployments, scan coverage areas, and manage sales leads." />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script>
      // Signal when mapboxgl CDN is ready — no polling needed
      window.__mapboxReady = false;
      window.__mapboxReadyCallbacks = [];
      window.__onMapboxReady = function(cb) {
        // Resolve if the flag is set OR the library is already present — a
        // cached/re-executed script can miss the onload event, leaving the
        // flag false while mapboxgl is fully loaded. Without this fallback the
        // map's token fetch stays queued forever ("Loading map…" hang).
        if (window.__mapboxReady || typeof window.mapboxgl !== "undefined") { cb(); }
        else { window.__mapboxReadyCallbacks.push(cb); }
      };
    </script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js" onload="window.__mapboxReady=true;window.__mapboxReadyCallbacks.forEach(function(cb){cb();});window.__mapboxReadyCallbacks=[];"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
