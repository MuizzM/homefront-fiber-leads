<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the knock sheet hugs the bottom edge and pads itself
         with env(safe-area-inset-bottom) on notched phones. No maximum-scale /
         user-scalable=no: blocking pinch-zoom fails WCAG 2.2 AA (1.4.4 Resize
         Text). iOS focus-zoom is prevented instead by ≥16px form controls (CSS). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Home Front Solutions</title>
    <meta name="description" content="Home Front Solutions team portal — field map, leads, and territory management." />
    <link rel="icon" type="image/png" href="/hfs-logo.png" />
    <meta name="theme-color" content="#0F2A44" />
    <!-- PWA: installable on mobile home screens, standalone launch, iOS ATHS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeFront" />
    <script>
      // Apply saved theme before paint to avoid a flash (dark is the default).
      (function () {
        try {
          var t = localStorage.getItem('hfs-theme');
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <!-- Fonts are self-hosted (@fontsource-variable/inter, bundled by Vite) — no
         Google Fonts requests. Mapbox is the only third-party origin; preconnect
         twice: plain for the script/CSS tags (non-CORS), crossorigin for the
         library's tile/style fetches. -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <!-- Loaded normally: the media="print" onload-flip trick silently failed in
         some environments, leaving Mapbox's CSS print-only — the user-location
         dot rendered as an unstyled invisible div. ~12KB gz from a preconnected
         origin is cheaper than a broken blue dot. -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script>
      // Signal when mapboxgl CDN is ready — no polling needed
      window.__mapboxReady = false;
      window.__mapboxReadyCallbacks = [];
      window.__onMapboxReady = function(cb) {
        // Resolve if the flag is set OR the library is already present — a
        // cached/re-executed script can miss the onload event, leaving the
        // flag false while mapboxgl is fully loaded. Without this fallback the
        // map's token fetch stays queued forever ("Loading map…" hang).
        if (window.__mapboxReady || typeof window.mapboxgl !== "undefined") { cb(); }
        else { window.__mapboxReadyCallbacks.push(cb); }
      };
    </script>
    <!-- defer: load in the background so it never blocks first paint on non-map
         pages; the __onMapboxReady callback pattern above handles readiness. -->
    <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js" onload="window.__mapboxReady=true;window.__mapboxReadyCallbacks.forEach(function(cb){cb();});window.__mapboxReadyCallbacks=[];"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
