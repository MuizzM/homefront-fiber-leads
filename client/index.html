<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the knock sheet hugs the bottom edge and pads itself
         with env(safe-area-inset-bottom) on notched phones. No maximum-scale /
         user-scalable=no: blocking pinch-zoom fails WCAG 2.2 AA (1.4.4 Resize
         Text). iOS focus-zoom is prevented instead by ≥16px form controls (CSS). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Home Front Solutions</title>
    <meta name="description" content="Home Front Solutions team portal — field map, leads, and territory management." />
    <link rel="icon" type="image/png" href="/hfs-logo.png" />
    <!-- Matches the dark ink app background (--background 216 22% 6%) so the
         browser chrome / notch area blends with the translucent status bar. -->
    <meta name="theme-color" content="#0C0F13" />
    <!-- PWA: installable on mobile home screens, standalone launch, iOS ATHS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeFront" />
    <script>
      // Apply saved theme before paint to avoid a flash (dark is the default).
      (function () {
        try {
          var t = localStorage.getItem('hfs-theme');
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <!-- Fonts are self-hosted (@fontsource-variable/inter, bundled by Vite) — no
         Google Fonts requests. Mapbox GL (~230KB gz + CSS) is the only third-party
         origin and is LAZY-loaded (see below): login + the entire rep flow never
         download it. Preconnect so the eventual map-screen load is fast. -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <script>
      // ── Lazy Mapbox loader ───────────────────────────────────────────────────
      // Mapbox GL used to load on EVERY page (login, Today, Leads…) even though
      // only the admin/scan map screens use it. Now the library + CSS are injected
      // on the FIRST call to window.__onMapboxReady(cb) / window.__loadMapbox() —
      // so a session that never opens a map screen never pays the ~230KB. The
      // __onMapboxReady(cb) contract is unchanged for existing callers.
      (function () {
        var V = "https://api.mapbox.com/mapbox-gl-js/v3.3.0/";
        window.__mapboxReady = false;
        window.__mapboxReadyCallbacks = [];
        window.__loadMapbox = function () {
          if (window.__mapboxLoading || window.__mapboxReady || typeof window.mapboxgl !== "undefined") return;
          window.__mapboxLoading = true;
          if (!document.getElementById("mapbox-css")) {
            var css = document.createElement("link");
            css.id = "mapbox-css"; css.rel = "stylesheet"; css.href = V + "mapbox-gl.css";
            document.head.appendChild(css);
          }
          var js = document.createElement("script");
          js.src = V + "mapbox-gl.js"; js.async = true;
          js.onload = function () {
            window.__mapboxReady = true;
            window.__mapboxReadyCallbacks.forEach(function (cb) { cb(); });
            window.__mapboxReadyCallbacks = [];
          };
          document.head.appendChild(js);
        };
        window.__onMapboxReady = function (cb) {
          // Already present (cached / re-exec) → resolve immediately; else queue
          // the callback AND kick off the lazy load.
          if (window.__mapboxReady || typeof window.mapboxgl !== "undefined") { cb(); return; }
          window.__mapboxReadyCallbacks.push(cb);
          window.__loadMapbox();
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
