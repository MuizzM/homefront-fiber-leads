name: Deploy production

# Production is deliberately manual. Configure the `production` environment
# with required reviewers before adding its SSH secrets.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from the protected default branch
        required: true
        type: string
      # The switch existed in deploy.sh but nothing could reach it: the workflow
      # is the only way production is deployed, and it never passed the variable.
      # A release you judge risky is exactly when you cannot SSH in to set it.
      with_backup:
        description: Take the encrypted offline DB snapshot inside this deploy (slower cutover — use for a risky release)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release SHA
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      default_branch: ${{ steps.release.outputs.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: release
        name: Require an exact commit on the default branch
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full, lowercase 40-character Git commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git fetch --no-tags origin "$REQUESTED_SHA"
          test "$(git cat-file -t "${REQUESTED_SHA}^{commit}")" = commit
          test "$(git rev-parse "${REQUESTED_SHA}^{commit}")" = "$REQUESTED_SHA"
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Refusing to deploy a commit that is not on origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

          # Ancestry proves provenance, not quality. Require the repository's CI
          # workflow to have completed successfully for this exact immutable SHA.
          CI_SUCCESSES="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${REQUESTED_SHA}&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )"
          if [ "$CI_SUCCESSES" -lt 1 ]; then
            echo "Refusing to deploy $REQUESTED_SHA: CI has not succeeded for this exact commit" >&2
            exit 1
          fi
          printf 'commit_sha=%s\n' "$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'default_branch=%s\n' "$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Approval-gated production deploy
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://portal.homefrontsolutionsllc.com
    steps:
      - name: Deploy exact release over pinned SSH host key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.commit_sha }}
          DEFAULT_BRANCH: ${{ needs.validate-release.outputs.default_branch }}
          # Not in the required-value loop below: absent means "no snapshot",
          # which is the long-standing default, not a misconfiguration.
          WITH_BACKUP: ${{ inputs.with_backup }}
        shell: bash
        run: |
          set -euo pipefail
          for required in DEPLOY_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS RELEASE_SHA DEFAULT_BRANCH; do
            if [ -z "${!required:-}" ]; then
              echo "Required production deployment value $required is not configured" >&2
              exit 1
            fi
          done
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$DEFAULT_BRANCH" != -* ]]
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null

          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "DEPLOY_KNOWN_HOSTS does not contain a pinned key for DEPLOY_HOST" >&2
            exit 1
          }

          # ServerAlive keepalives defeat idle NAT drops on the launch call.
          # The deploy itself runs DETACHED on the box (setsid, own session):
          # a dropped SSH pipe previously killed deploy.sh mid-offline-window —
          # including its restore trap — which could leave production STOPPED.
          # Detached, the box always finishes (deploy or self-rollback) no
          # matter what happens to this runner; we poll for the result over
          # fresh short-lived connections.
          SSH=(ssh
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=12
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$RELEASE_SHA" "$DEFAULT_BRANCH" "${WITH_BACKUP:-false}" <<'REMOTE'
          set -euo pipefail
          RELEASE_SHA="$1"
          DEFAULT_BRANCH="$2"
          WITH_BACKUP="${3:-false}"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Whitelist rather than truthiness: anything unrecognised must read as
          # "no snapshot" loudly, never as a silent yes on a release you meant
          # to protect.
          [[ "$WITH_BACKUP" =~ ^(true|false)$ ]]
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$DEFAULT_BRANCH" != -* ]]
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null

          cd /srv/homefront

          # Reclaim disk BEFORE the checkout/build. Every release builds a full
          # image; without this, images from prior deploys accumulate until the
          # host runs out of space and `git fetch`/`checkout` fail outright
          # (production incident 2026-08-02). `-a` drops every image that no
          # CONTAINER references — the running app's image is in use, so it is
          # always kept; only superseded release images and stale build cache
          # are removed. It never touches volumes, so the database is safe.
          # Best-effort: a prune hiccup (or docker absent) must never abort a
          # deploy, hence `|| true` under `set -e`.
          docker image prune -af >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git fetch --no-tags origin "$RELEASE_SHA"
          test "$(git cat-file -t "${RELEASE_SHA}^{commit}")" = commit
          test "$(git rev-parse "${RELEASE_SHA}^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"

          # Deploy the EXACT release, recovering from a checkout an interrupted
          # deploy (or a disk-full write) left dirty. Previously the deploy
          # ABORTED on any dirty tree ("refusing to build from a dirty
          # checkout") — but that turned a half-finished prior deploy into a
          # wedge nothing on the box could clear remotely (production incident
          # 2026-08-02: git diff --quiet failed in <2s, no output, deploy dead).
          # We now hard-reset to the release and drop untracked cruft instead.
          # CRITICAL: `git clean -fd` has NO `-x`, so gitignored operational
          # data (the SQLite DB, ops-data/) is NEVER removed — only stray
          # tracked/untracked source files from a broken checkout. The database
          # also lives on a persistent volume outside this tree, doubly safe.
          git checkout --detach "$RELEASE_SHA"
          git reset --hard "$RELEASE_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          # After the forced clean the tree must be pristine (gitignored data is
          # excluded from this check); anything left is genuinely unexpected.
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Refusing to build: checkout still dirty after reset --hard + clean" >&2
            git status --short >&2
            exit 1
          fi

          RUN_DIR=/srv/homefront/.deploy-run
          mkdir -p "$RUN_DIR"
          # Self-heal a WEDGED prior deploy. A deploy.sh that hung (e.g. the disk
          # filled mid-build) keeps its flock on .deploy.lock, and every later
          # deploy then dies with "another deploy is already running" — the
          # permanent wedge behind the 2026-08-02 outage, previously cleared only
          # by a human `pkill` on the box. The workflow's concurrency group
          # (deploy-production, cancel-in-progress: false) serializes Actions
          # runs, so no LEGITIMATE peer deploy is executing while THIS job runs;
          # a deploy.sh still alive is an orphan from a job that already ended
          # (timed out / cancelled / lost its runner) but left the detached
          # process behind. We kill only a clearly-STUCK orphan — one alive far
          # longer than a healthy deploy (~7 min); a fresh process is left
          # untouched so a rare hand-run SSH deploy is never yanked mid-cutover.
          # flock releases when the holder dies; removing the lock file is
          # belt-and-suspenders. All best-effort under set -e.
          for stuck in $(pgrep -f 'scripts/deploy\.sh' 2>/dev/null || true); do
            secs="$(ps -o etimes= -p "$stuck" 2>/dev/null | tr -cd '0-9')"
            if [ -n "$secs" ] && [ "$secs" -gt 1200 ]; then
              echo "Clearing stuck orphaned deploy pid $stuck (alive ${secs}s, no live peer possible under the concurrency group)" >&2
              kill -TERM "$stuck" 2>/dev/null || true
              for _ in 1 2 3 4 5; do kill -0 "$stuck" 2>/dev/null || break; sleep 1; done
              kill -KILL "$stuck" 2>/dev/null || true
              rm -f /srv/homefront/.deploy.lock
            fi
          done
          if [ -f "$RUN_DIR/pid" ] && kill -0 "$(cat "$RUN_DIR/pid")" 2>/dev/null; then
            echo "Refusing: a deploy is already running (pid $(cat "$RUN_DIR/pid"))" >&2
            exit 1
          fi
          rm -f "$RUN_DIR/status"
          : > "$RUN_DIR/log"
          # Own session + no inherited stdio: sshd teardown can never signal it.
          # deploy.sh itself also holds .deploy.lock (flock) against races.
          # deploy.sh tests for the literal "1"; an if/then rather than a
          # `[ ] && x=1`, whose non-zero status would abort under set -e.
          if [ "$WITH_BACKUP" = "true" ]; then
            DEPLOY_WITH_BACKUP=1
            echo "[deploy] in-deploy offline snapshot: ENABLED for this release"
          else
            DEPLOY_WITH_BACKUP=0
            echo "[deploy] in-deploy offline snapshot: deferred to the scheduled job"
          fi
          env RELEASE_SHA="$RELEASE_SHA" RUN_DIR="$RUN_DIR" DEPLOY_WITH_BACKUP="$DEPLOY_WITH_BACKUP" setsid bash -c '
            cd /srv/homefront
            scripts/deploy.sh "$RELEASE_SHA" >> "$RUN_DIR/log" 2>&1
            echo $? > "$RUN_DIR/status"
          ' < /dev/null >> "$RUN_DIR/log" 2>&1 &
          echo $! > "$RUN_DIR/pid"
          echo "Launched detached deploy of $RELEASE_SHA (pid $(cat "$RUN_DIR/pid"))"
          REMOTE

          # Poll for completion over fresh short connections (≤45 min: the
          # detached deploy self-rolls-back on failure, so waiting is safe).
          echo "Polling the detached deploy…"
          LAST_LINE=""
          for attempt in $(seq 1 180); do
            sleep 15
            if ! SNAP="$("${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              'RUN=/srv/homefront/.deploy-run; if [ -f "$RUN/status" ]; then printf "STATUS:%s\n" "$(cat "$RUN/status")"; fi; tail -n 1 "$RUN/log" 2>/dev/null || true')"; then
              echo "[poll $attempt] transient SSH failure; retrying…"
              continue
            fi
            CUR="$(printf '%s\n' "$SNAP" | grep -v '^STATUS:' | tail -n 1 || true)"
            if [ -n "$CUR" ] && [ "$CUR" != "$LAST_LINE" ]; then
              echo "[remote] $CUR"
              LAST_LINE="$CUR"
            fi
            STATUS_LINE="$(printf '%s\n' "$SNAP" | grep '^STATUS:' | head -n 1 || true)"
            if [ -n "$STATUS_LINE" ]; then
              RESULT="${STATUS_LINE#STATUS:}"
              echo "── remote deploy log (tail) ──"
              "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'tail -n 200 /srv/homefront/.deploy-run/log' || true
              [[ "$RESULT" =~ ^[0-9]+$ ]] || RESULT=1
              exit "$RESULT"
            fi
          done
          echo "Deploy did not report a result within 45 minutes — inspect /srv/homefront/.deploy-run/log on the host" >&2
          exit 1
