# Auto-deploy the portal to the Hetzner server on every push to this branch.
# Requires three repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST   → 178.156.204.225
#   DEPLOY_USER   → deploy
#   DEPLOY_SSH_KEY → the PRIVATE half of the github-actions-deploy key
name: Deploy portal

# Least privilege: this job only SSHes out with its own secrets and never touches
# the GitHub API, so the auto-provisioned GITHUB_TOKEN needs no scopes at all.
permissions: {}

on:
  push:
    branches: [rep-knocking-workflow]
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab

concurrency:
  group: deploy-portal      # never run two deploys at once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" bash -se <<'REMOTE'
            set -euo pipefail
            cd /srv/homefront
            git pull --ff-only
            export APP_IMAGE_TAG=$(git rev-parse --short HEAD)
            docker compose -f docker-compose.production.yml up -d --build
            # wait for health, else fail the job so you get a red X + email
            for i in $(seq 1 30); do
              if docker inspect --format '{{.State.Health.Status}}' homefront-app-1 | grep -q healthy; then
                echo "deployed $APP_IMAGE_TAG — healthy"; exit 0
              fi
              sleep 3
            done
            echo "app did not become healthy"; docker compose -f docker-compose.production.yml logs --tail 40 app; exit 1
          REMOTE
