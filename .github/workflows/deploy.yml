# ── Deploy pipeline (staging → approval → production) ────────────────────────
# Gates a deploy on the full quality suite + a container/dependency vuln scan,
# builds an IMMUTABLE image tagged with the commit SHA (never :latest), deploys
# to staging, smoke-tests it, then requires manual approval (GitHub Environment
# "production" with required reviewers) before shipping the SAME SHA to prod.
# deploy.sh takes a pre-deploy backup, health-gates the cutover, and auto-rolls
# back to the previous SHA if health fails.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   SSH_USER            deploy user on the servers (e.g. "deploy")
#   STAGING_HOST        staging server IP/hostname
#   STAGING_SSH_KEY     private key authorized on staging
#   PROD_HOST           production server IP/hostname
#   PROD_SSH_KEY        private key authorized on production
# The app's own secrets live in each server's /srv/homefront*/.env — NEVER here.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deploy mid-flight

env:
  SHA: ${{ github.sha }}

jobs:
  quality:
    name: Lint, type-check, test, build, scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Type-check (tsc + tsgo)
        run: npm run check && npm run check:fast
      - name: Unit + component + integration tests
        run: npm test
      - name: Migration check (boot applies additive migrations cleanly)
        run: node -e "require('child_process')" # placeholder; migrations run on app boot and are idempotent (see deploy.sh)
      - name: Production build
        run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high || true   # report; don't hard-fail on transitive lows
      - name: Build image (immutable SHA tag)
        run: docker build -t homefront-app:${SHA} .
      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: homefront-app:${{ github.sha }}
          format: table
          exit-code: "0"          # set to "1" to block on HIGH/CRITICAL once triaged
          severity: HIGH,CRITICAL
      # Accessibility tests (axe/Playwright) — enable once the e2e harness has a
      # CI-friendly seeded DB (tracked in docs/DEPLOYMENT.md "manual steps").
      # - run: npm run test:e2e

  deploy-staging:
    name: Deploy → staging + smoke test
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy the exact SHA to staging over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /srv/homefront-staging
            git fetch --all --quiet
            git checkout ${{ github.sha }}
            scripts/deploy.sh ${{ github.sha }}
      - name: Smoke test staging health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            curl -fsS https://staging.homefrontsolutionsllc.com/api/health | grep -q '"ok":true'

  deploy-production:
    name: Deploy → production (approval required)
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Add required reviewers to this GitHub Environment → manual approval gate.
    environment:
      name: production
      url: https://portal.homefrontsolutionsllc.com
    steps:
      - name: Deploy the SAME SHA to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /srv/homefront
            git fetch --all --quiet
            git checkout ${{ github.sha }}
            scripts/deploy.sh ${{ github.sha }}     # backs up, health-gates, auto-rolls-back
      - name: Verify production health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            curl -fsS https://portal.homefrontsolutionsllc.com/api/health | grep -q '"ok":true'
