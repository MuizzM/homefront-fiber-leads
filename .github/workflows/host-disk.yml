name: Host disk (production)

# Look at — and reclaim — disk on the production box, without SSH.
#
# WHY THIS EXISTS
# The production SSH key lives only as a repository secret, so nobody has a
# shell. That is the right posture, but it meant that when an APPLY of the area
# reset died with SQLITE_FULL there was no way to find out what was filling the
# volume, let alone clear it. This is the missing tool: the same pinned-host-key
# connection deploy.yml uses, doing read-only diagnostics by default.
#
# `report` (the default) writes NOTHING. `reclaim` removes only things that are
# reproducible or already dead:
#   · abandoned data.before-area-reset-*.db — partial VACUUM output from a
#     failed run. Never a valid database, nothing reads it.
#   · dangling docker images and build cache — rebuilt on demand.
#   · the SQLite WAL, via a TRUNCATE checkpoint — the pages are already in the
#     main database; this only returns the file's tail to the filesystem.
# It never touches data.db, uploads, release images, or backups.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "report (read-only), reclaim (frees space), compact (rewrites the DB file)"
        required: true
        default: report
        type: choice
        options: [report, reclaim, compact]
      deep:
        description: "Per-object DB breakdown (slow: walks every page of an 18 GB file)"
        required: false
        default: false
        type: boolean
      confirm:
        description: 'Required for reclaim/compact: type RECLAIM or COMPACT'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: host-disk-production
  cancel-in-progress: false

jobs:
  disk:
    name: ${{ inputs.action == 'reclaim' && 'RECLAIM disk' || inputs.action == 'compact' && 'COMPACT database' || 'Report disk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://portal.homefrontsolutionsllc.com
    steps:
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ACTION" = "reclaim" ] && [ "$CONFIRM" != "RECLAIM" ]; then
            echo "Refusing to reclaim: type RECLAIM in 'confirm'." >&2
            exit 1
          fi
          if [ "$ACTION" = "compact" ] && [ "$CONFIRM" != "COMPACT" ]; then
            echo "Refusing to compact: type COMPACT in 'confirm'." >&2
            exit 1
          fi
          echo "action=$ACTION"

      - name: Connect and run
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ACTION: ${{ inputs.action }}
          DEEP: ${{ inputs.deep && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          for required in DEPLOY_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!required:-}" ]; then
              echo "Required production value $required is not configured" >&2
              exit 1
            fi
          done

          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "DEPLOY_KNOWN_HOSTS does not contain a pinned key for DEPLOY_HOST" >&2
            exit 1
          }

          ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$ACTION" "${DEEP:-0}" <<'REMOTE'
          set -euo pipefail
          ACTION="$1"
          export DEEP="${2:-0}"
          [[ "$ACTION" =~ ^(report|reclaim|compact)$ ]]
          [[ "$DEEP" =~ ^[01]$ ]]
          cd /srv/homefront
          SUDO=""; command -v sudo >/dev/null && SUDO="sudo"

          hr() { echo "──────────────────────────────────────────────────────"; }
          show_df() { df -h / 2>/dev/null | sed 's/^/  /'; }

          hr; echo "FILESYSTEM"; show_df
          hr; echo "DOCKER"
          docker system df 2>/dev/null | sed 's/^/  /' || true
          hr; echo "RELEASE IMAGES (deploy.sh keeps current + previous)"
          echo "  .deployed-tag: $(cat .deployed-tag 2>/dev/null || echo none)"
          echo "  .previous-tag: $(cat .previous-tag 2>/dev/null || echo none)"
          docker images homefront-app --format '  {{.Tag}}  {{.Size}}  {{.CreatedSince}}' 2>/dev/null | head -20 || true

          VOL="$(docker volume inspect homefront_app-data --format '{{.Mountpoint}}' 2>/dev/null || true)"
          hr; echo "DATA VOLUME  ${VOL:-<not found>}"
          if [ -n "$VOL" ]; then
            $SUDO du -sh "$VOL" 2>/dev/null | sed 's/^/  total  /' || true
            echo "  largest entries (top level + uploads):"
            $SUDO du -ah --max-depth=2 "$VOL" 2>/dev/null | sort -rh | head -12 | sed 's/^/    /' || true
          fi

          # ── Inside the database ──────────────────────────────────────────
          # `du` says the FILE is 19 GB; it cannot say how much of that is live
          # data and how much is free pages a delete already released. Those
          # need very different responses — more retention vs. reclaiming — so
          # measure before deciding. Read-only, on the live file.
          APP="$(docker compose -f docker-compose.production.yml ps -q app 2>/dev/null | head -n1 || true)"
          [ -n "$APP" ] || APP="$(docker ps --format '{{.ID}} {{.Image}}' | awk '/homefront-app:/{print $1; exit}' || true)"
          hr; echo "DATABASE"
          if [ -n "$APP" ]; then
            docker exec "$APP" node -e "
              const D = require('better-sqlite3');
              const db = new D(process.env.DATA_DIR + '/data.db', { readonly: true });
              const p = (k) => db.pragma(k, { simple: true });
              const pageSize = p('page_size'), pageCount = p('page_count'), freelist = p('freelist_count');
              const gb = (bytes) => (bytes / 1073741824).toFixed(2) + ' GB';
              console.log('  page_size      ' + pageSize);
              console.log('  file           ' + gb(pageSize * pageCount));
              console.log('  free pages     ' + gb(pageSize * freelist) + '  (' + (100 * freelist / pageCount).toFixed(1) + '% of the file)');
              console.log('  live data      ' + gb(pageSize * (pageCount - freelist)));
              console.log('  auto_vacuum    ' + p('auto_vacuum') + '   (0=NONE 1=FULL 2=INCREMENTAL)');
              console.log('  journal_mode   ' + p('journal_mode'));
              console.log('');
              // dbstat walks EVERY page. On an 18.8 GB file that is minutes of
              // I/O against the live volume, so it is opt-in: the page/freelist
              // numbers above are what an incident actually needs, and they are
              // instant. DEEP=1 when you want the per-object breakdown.
              try {
                if (process.env.DEEP !== '1') throw new Error('skipped — set DEEP=1 for the per-object breakdown');
                const rows = db.prepare(\"SELECT name, SUM(pgsize) AS bytes FROM dbstat GROUP BY name ORDER BY bytes DESC LIMIT 15\").all();
                console.log('  largest objects (table or index):');
                for (const r of rows) console.log('    ' + gb(r.bytes).padStart(9) + '  ' + r.name);
              } catch (e) {
                console.log('  per-object breakdown: ' + e.message);
                if (process.env.DEEP === '1') {
                  console.log('  row counts instead:');
                  const tables = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\").all();
                  const counts = tables.map((t) => {
                    try { return { name: t.name, n: db.prepare('SELECT COUNT(*) n FROM \\\"' + t.name + '\\\"').get().n }; }
                    catch { return { name: t.name, n: -1 }; }
                  }).sort((a, b) => b.n - a.n).slice(0, 15);
                  for (const c of counts) console.log('    ' + String(c.n).padStart(12) + '  ' + c.name);
                }
              }
            " 2>&1 | sed 's/^/  /' || echo "  (could not read the database)"
          else
            echo "  no running app container found"
          fi

          # ── Release assets ───────────────────────────────────────────────
          # The onboarding PDFs embed the HFS logo, resolved from beside the
          # bundle at runtime. If that asset never reaches the image the
          # renderer degrades silently to a wordmark — which looks fine in
          # review and wrong on a signed contract, so it is checked HERE, in
          # the image that is actually serving.
          hr; echo "BRANDING ASSETS"
          if [ -n "$APP" ]; then
            docker exec "$APP" node -e "
              const fs=require('fs'), path=require('path');
              const candidates=[path.resolve('/app/dist/public/hfs-logo-full.png'), path.resolve(process.cwd(),'dist/public/hfs-logo-full.png')];
              const found=candidates.find(c=>{try{return fs.statSync(c).isFile()}catch{return false}});
              console.log('  logo: ' + (found ? found + '  (' + fs.statSync(found).size + ' bytes)' : 'NOT FOUND — PDFs will fall back to a wordmark'));
              // NEVER require() the server bundle to probe it. dist/index.cjs is
              // an ENTRY POINT: requiring it runs the whole app — a second
              // instance inside the live container, sharing the production
              // database and volume, starting schedulers, scan workers and cron
              // ticks that spend real money. An earlier version of this file did
              // exactly that and hung the diagnostic for twenty-five minutes.
              // A diagnostic reads; it does not execute what it is inspecting.
            " 2>&1 | sed 's/^/  /' || echo "  (could not inspect the image)"
          else
            echo "  no running app container"
          fi

          # ── Processes in the app container ───────────────────────────────
          # A `docker exec` can outlive the SSH session that started it. If a
          # diagnostic ever executes rather than reads (see the note above), the
          # stray it leaves behind is a SECOND app instance on the live
          # database — so the check for one belongs here permanently.
          hr; echo "APP CONTAINER PROCESSES"
          if [ -n "$APP" ]; then
            # docker top reads from the HOST — the slim image has no ps.
            docker top "$APP" -eo pid,etime,args 2>/dev/null | sed 's/^/  /' || echo "  (could not list processes)"
          else
            echo "  no running app container"
          fi

          # ── Prune state ──────────────────────────────────────────────────
          hr; echo "DB PRUNE"
          # Match SUCCESS *and* FAILURE. structuredLog writes "db_prune.done";
          # the scheduler's catch writes "[db-prune] skipped". Grepping only the
          # first makes a crashing prune indistinguishable from a healthy one —
          # silence is not success, and this filter previously had that exact
          # blind spot while being used to conclude the prune had not run.
          echo "  container started: $(docker inspect -f '{{.State.StartedAt}}' "$APP" 2>/dev/null || echo unknown)"
          echo "  deployed tag:      $(cat .deployed-tag 2>/dev/null || echo none)"
          FOUND="$(docker logs --since 24h "$APP" 2>&1 | grep -aE "db_prune|db-prune" | tail -5 || true)"
          if [ -n "$FOUND" ]; then echo "$FOUND" | sed 's/^/  /'; else
            echo "  NO prune line of any kind (neither db_prune.done nor [db-prune] skipped)"
            echo "  last 5 log lines, for context:"
            docker logs --tail 5 "$APP" 2>&1 | sed 's/^/    /' || true
          fi

          if [ "$ACTION" = "report" ]; then
            hr; echo "Report only — nothing was changed."
            exit 0
          fi

          # ── compact ──────────────────────────────────────────────────────
          # Rewrite data.db so the freelist is actually returned to the disk.
          # auto_vacuum is NONE, so nightly pruning only ever moves pages onto
          # the freelist for reuse: the file stops growing but never shrinks.
          # This is the deliberate, supervised way to shrink it — separate from
          # `reclaim` because it needs the app STOPPED and free space equal to
          # the live data, and it refuses rather than half-doing it.
          if [ "$ACTION" = "compact" ]; then
            hr; echo "COMPACT"
            if [ -z "$APP" ]; then echo "  no app container found — aborting" >&2; exit 1; fi
            VOL_DIR="$VOL"
            LIVE_BYTES="$(docker exec "$APP" node -e "
              const D=require('better-sqlite3');
              const db=new D(process.env.DATA_DIR+'/data.db',{readonly:true});
              const p=k=>db.pragma(k,{simple:true});
              process.stdout.write(String(p('page_size')*(p('page_count')-p('freelist_count'))));
            " 2>/dev/null || echo 0)"
            AVAIL_BYTES=$(( $(df -k / | awk 'NR==2{print $4}') * 1024 ))
            echo "  live data $(( LIVE_BYTES / 1073741824 )) GB · free disk $(( AVAIL_BYTES / 1073741824 )) GB"
            # 20% head-room: the rewrite is not the only thing writing to this
            # disk, and finishing with zero bytes spare is its own incident.
            if [ "$LIVE_BYTES" -le 0 ] || [ "$AVAIL_BYTES" -lt $(( LIVE_BYTES * 12 / 10 )) ]; then
              echo "  REFUSING: need ~$(( LIVE_BYTES * 12 / 10 / 1073741824 )) GB free to rewrite safely." >&2
              echo "  Prune first (the nightly job now covers scan_run_targets), then retry." >&2
              exit 1
            fi

            NEW="$VOL_DIR/data.compacting.db"
            $SUDO rm -f "$NEW"
            echo "  stopping app…"
            docker compose -f docker-compose.production.yml stop app
            # VACUUM INTO on the STOPPED database: no writer can race the copy,
            # and a failure leaves the original untouched because the original
            # is never modified — only replaced, after the copy is complete.
            echo "  rewriting…"
            if docker compose -f docker-compose.production.yml run --rm --no-deps --entrypoint node app \
                 -e "const D=require('better-sqlite3');const db=new D(process.env.DATA_DIR+'/data.db');db.prepare('VACUUM INTO ?').run(process.env.DATA_DIR+'/data.compacting.db');"; then
              OLD_SZ="$($SUDO stat -c %s "$VOL_DIR/data.db")"
              NEW_SZ="$($SUDO stat -c %s "$NEW")"
              echo "  $(( OLD_SZ / 1073741824 )) GB → $(( NEW_SZ / 1073741824 )) GB"
              # Swap only after the rewrite succeeded, keeping the original
              # under a .replaced name until the app is verified healthy.
              $SUDO mv "$VOL_DIR/data.db" "$VOL_DIR/data.replaced.db"
              $SUDO mv "$NEW" "$VOL_DIR/data.db"
              $SUDO rm -f "$VOL_DIR/data.db-wal" "$VOL_DIR/data.db-shm"
            else
              echo "  rewrite FAILED — original untouched" >&2
              $SUDO rm -f "$NEW"
              docker compose -f docker-compose.production.yml up -d app
              exit 1
            fi
            echo "  starting app…"
            docker compose -f docker-compose.production.yml up -d app
            for i in $(seq 1 30); do
              sleep 5
              if curl -fsS --max-time 5 http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
                echo "  healthy — removing the pre-compaction copy"
                $SUDO rm -f "$VOL_DIR/data.replaced.db"
                break
              fi
              [ "$i" = "30" ] && {
                echo "  UNHEALTHY after compaction. The original is at data.replaced.db —" >&2
                echo "  stop app, mv data.replaced.db data.db, start app." >&2
                exit 1
              }
            done
            df -h / | sed 's/^/  /'
            exit 0
          fi

          BEFORE_KB="$(df -k / | awk 'NR==2{print $4}')"
          hr; echo "RECLAIMING"

          # 1. Partial VACUUM output from a failed reset. Never a valid database.
          if [ -n "$VOL" ]; then
            STALE="$($SUDO find "$VOL" -maxdepth 1 -name 'data.before-area-reset-*.db' 2>/dev/null || true)"
            if [ -n "$STALE" ]; then
              echo "  abandoned snapshots:"; echo "$STALE" | sed 's/^/    /'
              echo "$STALE" | xargs -r $SUDO rm -f
            else
              echo "  abandoned snapshots: none"
            fi
          fi

          # 2. Dangling images + build cache — reproducible, nothing depends on them.
          echo "  docker image prune (dangling only):"
          docker image prune -f 2>/dev/null | sed 's/^/    /' || true
          echo "  docker builder prune:"
          docker builder prune -f 2>/dev/null | sed 's/^/    /' || true

          # 3. WAL truncate. The pages are already in the main database — this
          #    only returns the file's tail to the filesystem. Run through the
          #    LIVE container so it shares the app's connection and locking
          #    rather than fighting it from outside.
          # NOT --filter ancestor=homefront-app: images are tagged with the
          # commit SHA (never :latest), and `ancestor` without a tag only
          # matches :latest — so that filter silently found nothing and the
          # checkpoint was skipped. Match on the compose service instead.
          APP="$(docker compose -f docker-compose.production.yml ps -q app 2>/dev/null | head -n1 || true)"
          [ -n "$APP" ] || APP="$(docker ps --format '{{.ID}} {{.Image}}' | awk '/homefront-app:/{print $1; exit}' || true)"
          if [ -n "$APP" ]; then
            echo "  wal_checkpoint(TRUNCATE):"
            docker exec "$APP" node -e "
              const D=require('better-sqlite3');
              const db=new D(process.env.DATA_DIR+'/data.db');
              const r=db.pragma('wal_checkpoint(TRUNCATE)');
              console.log('    '+JSON.stringify(r));
            " 2>&1 | sed 's/^/    /' || echo "    (skipped — could not run in container)"
          else
            echo "  wal_checkpoint: skipped, no running app container found"
          fi

          AFTER_KB="$(df -k / | awk 'NR==2{print $4}')"
          hr; echo "RESULT"
          show_df
          echo "  freed: $(( (AFTER_KB - BEFORE_KB) / 1024 )) MB"
          REMOTE

      - name: Next
        if: success()
        shell: bash
        run: |
          if [ "${{ inputs.action }}" = "reclaim" ]; then
            echo "::notice::Space reclaimed. Re-run the area reset dry run to confirm there is now room for the undo file and the update."
          else
            echo "::notice::Read-only report. Re-run with action=reclaim and confirm=RECLAIM to free space."
          fi
