# CI — runs on every push/PR. Must be green before a deploy (see deploy job gate).
# Mirrors the local quality gates: type-check (both compilers), unit + RTL tests,
# and a production build. Nothing here needs secrets, so it runs on any fork/PR.
name: CI

on:
  push:
    branches: [master, main, staging, rep-knocking-workflow, cc-integration]
  pull_request:
    branches: [master, main, rep-knocking-workflow, cc-integration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    # The complete suite now contains 6,700+ tests and takes about 14 minutes
    # on the hosted runner before the production build begins. Keep every gate,
    # but leave enough headroom for normal runner variance and the final build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent harness
        run: python3 scripts/validate-agent-harness.py

      - name: Deployment safety checks
        run: bash tests/deployment-safety.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Type-check (tsc — strict, noUnused*)
        run: npm run check

      - name: Check SQLite index definitions
        run: npm run check:indexes

      - name: Type-check (tsgo — fast native compiler)
        run: npm run check:fast

      - name: Unit + component tests
        run: npm test

      - name: Production build
        run: npm run build

      # Playwright e2e is opt-in (needs a browser + running server); enable once
      # a CI-friendly test DB fixture exists.
      # - name: Install Playwright
      #   run: npm run test:e2e:install
      # - name: E2E
      #   run: npm run test:e2e

  runtime-image:
    name: Production image native smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production runtime
        run: docker build --target runtime --tag homefront-runtime-smoke .
      - name: Verify native SQLite, transactions, backup and workers without network
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,noexec,size=64m,mode=1777 --entrypoint node homefront-runtime-smoke script/runtime-smoke.cjs
