name: DB backup (off-host, verified)

# The first backup this deployment has ever had, and why it looks like this:
#
# The box CANNOT back itself up. data.db is ~19 GB, the disk has ~6 GB free,
# and scripts/backup.sh (on-box staging, age encryption, cron per
# INFRASTRUCTURE.md) needs the staging space that has never existed — the
# capacity report shows zero backups and no cron log, ever. The deploy-time
# snapshot (with_backup) is blocked by the same arithmetic. So the copy must
# LEAVE the machine as it is produced:
#
#   host: scripts/db-dump-stream.cjs (shipped per-run, run inside the app
#         image via compose run) streams one consistent WAL-snapshot SQL dump
#         to stdout — the box never stages a byte
#   ssh:  carries the stream to the runner
#   here: zstd-compress, check the dump's completeness sentinel, UPLOAD, and
#         then PROVE it restores — scripts/db-verify-stream.cjs rebuilds each
#         table in its own throwaway SQLite db, integrity_checks it, matches
#         COUNT(*) against the dump's embedded rowcount manifest, and deletes
#         it before the next table starts.
#
# ORDERING (changed 2026-08-27, and the comment matters more than the code):
# upload comes BEFORE verification. The original order — verify, then upload
# only what was proven — sounds stricter and in practice destroyed every
# backup we had: the verifier restored the whole ~20 GB database at once, the
# runner's ~13 GiB disk stopped fitting it in 2026-08-16, and the upload was
# skipped as a dependent step for two months of Sundays while the dump itself
# succeeded every time. A complete-but-unproven copy beats no copy. The
# restore proof still gates the JOB, the step summary says which of the two
# you are holding, and a failure now opens an issue instead of sitting red
# and unread. Artifacts are repo-private but NOT
# encrypted (no AGE_RECIPIENT secret exists in Actions); treat repo access as
# backup access. Retention is short and deliberate — this is a safety net,
# not an archive. If artifact storage quota becomes a problem, the durable
# answer is object storage (litestream/S3) with real credentials — see the
# scan-architecture plan.
#
# COST ON THE BOX: the dump holds one read snapshot for its duration
# (~5-10 min), which starves WAL checkpointing exactly that long — the WAL
# grows during the dump and the in-app guard reclaims it after. Scheduled
# for 07:30 UTC Sunday (03:30 ET — dead hours for reps).

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "How long to keep the uploaded backup artifact"
        required: false
        default: "8"
        type: string
  schedule:
    - cron: "30 7 * * 0"

permissions:
  contents: read
  issues: write        # so a failed backup can raise one — see the last step

concurrency:
  group: db-backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, verify by restoring, upload
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Stream the dump from the production host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for required in DEPLOY_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!required:-}" ]; then
              echo "Required production value $required is not configured" >&2
              exit 1
            fi
          done

          install -d -m 700 "$HOME/.ssh"
          trap 'rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "DEPLOY_KNOWN_HOSTS does not contain a pinned key for DEPLOY_HOST" >&2
            exit 1
          }
          SSH_OPTS=(-i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=80
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          # Ship the dumper for THIS ref, run it inside the RUNNING image (same
          # .deployed-tag logic as import-fcc-pins.yml), stream stdout home.
          # Every compose run gets </dev/null — see the 2026-08-09 heredoc
          # lesson in import-fcc-pins.yml.
          scp "${SSH_OPTS[@]}" scripts/db-dump-stream.cjs \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hf-db-dump.cjs"

          mkdir -p backup
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            cd /srv/homefront
            TAG="$(cat .deployed-tag 2>/dev/null || true)"
            if [ -z "$TAG" ]; then
              RUNNING="$(docker ps --filter "ancestor=homefront-app" --format "{{.Image}}" | head -n1)"
              TAG="${RUNNING##*:}"
            fi
            [ -n "$TAG" ] || { echo "cannot determine running image tag" >&2; exit 1; }
            echo "dumping via image homefront-app:$TAG" >&2
            # Mounted INTO /app (the image WORKDIR) so require("better-sqlite3")
            # resolves against /app/node_modules — from /tmp it finds nothing
            # (first run failed exactly there).
            APP_IMAGE_TAG="$TAG" docker compose -f docker-compose.production.yml \
              run --rm --no-deps \
              --volume /tmp/hf-db-dump.cjs:/app/hf-db-dump.cjs:ro \
              --entrypoint node app /app/hf-db-dump.cjs </dev/null
            rm -f /tmp/hf-db-dump.cjs
          ' </dev/null | zstd -T0 -3 -o backup/data.sql.zst

          ls -la backup/
          # A truncated stream compresses fine — the sentinel is the proof the
          # dumper reached its own end.
          zstdcat backup/data.sql.zst | tail -c 65536 | grep -q -- "-- dump-complete" || {
            echo "dump-complete sentinel missing — stream was cut; refusing this backup" >&2
            exit 1
          }

      # UPLOAD BEFORE VERIFYING — deliberately, and this is the ordering that
      # matters most in this file.
      #
      # It used to be the other way round: verify, and upload only what the
      # verify proved. That reads well and it cost us every backup we had. The
      # verify restored the WHOLE database into one file on the runner; when
      # production outgrew ~13 GiB of runner disk (2026-08-16) the step died
      # `database or disk is full`, the upload was skipped as a dependent step,
      # and the perfectly good dump sitting right there was discarded. Runs
      # 31935060179 and 32626895871 both dumped successfully and stored nothing.
      # Retention then aged out the last good artifact and production had NO
      # off-host backup at all for two weeks, discovered only when the box went
      # unreachable.
      #
      # The dump has already proven it is COMPLETE (the `-- dump-complete`
      # sentinel above; a cut stream never reaches here). Keeping a complete but
      # not-yet-restore-tested copy beats keeping nothing, every time. The
      # restore proof still runs, still gates the JOB's success, and still says
      # exactly what it proved — so an artifact from a RED run is readable as
      # "complete, not restore-tested", which is a real distinction an operator
      # can act on, rather than an absence they cannot.
      - name: Upload the backup (before verification — see comment)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/data.sql.zst
          retention-days: ${{ inputs.retention_days || 8 }}
          if-no-files-found: error

      - name: Verify by restoring — one table at a time
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -yq install sqlite3 zstd >/dev/null 2>&1 || true
          # The old verifier materialised the entire database at once and needed
          # >=12 GiB. scripts/db-verify-stream.cjs restores each table into its
          # OWN throwaway database, count- and integrity-checks it, and deletes
          # it before the next begins, so the peak is the LARGEST SINGLE TABLE
          # rather than the whole database — production can grow a long way
          # before that binds again. Every row still passes through real SQLite.
          for d in /mnt "$HOME"; do echo "  $d: $(df -BG --output=avail "$d" | tail -1 | tr -dc 0-9)G free"; done
          WORK_ROOT="$([ "$(df -B1 --output=avail /mnt | tail -1 | tr -dc 0-9)" -ge "$(df -B1 --output=avail "$HOME" | tail -1 | tr -dc 0-9)" ] && echo /mnt || echo "$HOME")"
          WORKDIR="$WORK_ROOT/verify"
          sudo mkdir -p "$WORKDIR" && sudo chown "$(id -u)" "$WORKDIR"
          echo "verifying table-by-table in $WORKDIR"
          time zstdcat backup/data.sql.zst \
            | node scripts/db-verify-stream.cjs --workdir "$WORKDIR" --summary /tmp/verify-summary
          df -h "$WORK_ROOT" | tail -1

      - name: Summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          SIZE="$(du -h backup/data.sql.zst 2>/dev/null | cut -f1 || echo "?")"
          {
            if [ -s /tmp/verify-summary ]; then
              echo "## Off-host backup: restore-verified ✔"
              echo ""
              echo "- verification: $(cat /tmp/verify-summary)"
            else
              echo "## Off-host backup: uploaded but NOT restore-verified ⚠"
              echo ""
              echo "- the dump is COMPLETE (the \`-- dump-complete\` sentinel passed) but the"
              echo "  restore proof did not finish. Treat this artifact as a last resort:"
              echo "  usable, not proven. Fix the verify step and re-run before relying on it."
            fi
            echo "- compressed size: $SIZE"
            echo "- restore recipe: \`zstdcat data.sql.zst | sqlite3 data.db\`, then place as \$DATA_DIR/data.db"
            echo "- unencrypted, repo-private artifact — repo access IS backup access"
          } >> "$GITHUB_STEP_SUMMARY"

      # THE DEFECT THAT MADE A CAPACITY PROBLEM A TWO-WEEK OUTAGE OF BACKUPS:
      # nothing told anyone. Two red scheduled runs sat unnoticed from 2026-08-16
      # until production went down on 08-26 and someone went looking. A backup
      # nobody is told about failing is not a backup.
      - name: Raise an issue if the backup failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TITLE="Off-host DB backup failed ($(date -u +%Y-%m-%d))"
          # One open issue at a time — a weekly cron must not open a new one every
          # week for the same unfixed cause.
          EXISTING="$(gh issue list --state open --label backup-failure --limit 1 --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL" || true
            exit 0
          fi
          gh label create backup-failure --description "Off-host DB backup workflow failed" --color B60205 2>/dev/null || true
          gh issue create --title "$TITLE" --label backup-failure --body \
            "The off-host production DB backup failed.

          Run: $RUN_URL

          Check in this order:
          1. Did the **dump** step succeed? If yes an artifact was still uploaded on
             that run — it is complete but not restore-tested, and is usable in an
             emergency.
          2. Did the **verify** step run out of disk? The verifier restores one table
             at a time, so this means a SINGLE table now exceeds the runner disk.
          3. Was it SSH/host? Then no artifact exists for this run and production has
             no fresh off-host copy.

          Production has no other backup path: the box cannot stage one itself." || true
