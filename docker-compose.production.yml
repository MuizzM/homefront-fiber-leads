# ── HomeFront Fiber — production stack (Hetzner Cloud) ────────────────────────
# Two services: the app (Express serving the SPA + API, SQLite on a volume) and
# Caddy (public reverse proxy + automatic Let's Encrypt HTTPS). ONLY Caddy binds
# host ports; the app is reachable only on the internal Docker network.
#
# Usage (see docs/DEPLOYMENT.md):
#   export APP_IMAGE_TAG=$(git rev-parse --short HEAD)   # immutable tag, never :latest
#   docker compose -f docker-compose.production.yml up -d --build
#
# All secrets come from ./.env (git-ignored) — never inline them here.

services:
  app:
    # Immutable tag — deploy.sh sets APP_IMAGE_TAG to the commit SHA. Fails fast
    # if unset so nobody accidentally ships an ambiguous image.
    image: homefront-app:${APP_IMAGE_TAG:?set APP_IMAGE_TAG to the commit SHA (never :latest)}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATA_DIR: /data          # data.db + uploads/ both live here (one volume)
      # ── Opportunity-weighted cadence engine (state monitor) ──────────────────
      # Enable the built-but-dormant per-market cadence loop so verified NC/SC
      # Kinetic markets recheck on opportunity (Coming-Soon/new-build/expanding =
      # 24h, served = 168h, low = 336h) rather than only via the statewide sweep.
      # Unlimited Decodo budget → live spend on; global dedup + the coordinator
      # address-lock prevent any double-check against the sweep.
      ENABLE_STATE_MONITORING: "off"
      STATE_MONITOR_LIVE: "off"
      # WEDGE ROOT CAUSE (2026-07-19): the state-monitor alert OUTBOX had 1.25M+
      # pending rows; every tick enqueued more fresh-fiber alert clusters (huge green
      # backlog) and drain-spun them against the mail providers 10/sec + daily-quota
      # limit — hundreds of state_monitor.alert_failed/sec pegged the one JS thread and
      # starved /api ~150s after every boot. ENABLE_STATE_MONITORING must be "off" (the
      # code checks `!== "off"`, so the earlier "false" left it ENABLED). The startup
      # tick fires runStateMonitorTick ONCE regardless of enabled, so park it far out
      # too. ENABLE_KINETIC_DIRECTORY_WATCH off (also runs in the tick). Re-enable after
      # the outbox is drained/capped and mail capacity is sorted.
      STATE_MONITOR_STARTUP_DELAY_MS: "86400000"
      ENABLE_KINETIC_DIRECTORY_WATCH: "off"
      # One-shot-per-12h priority burst: on boot, enqueue the Sugar-and-Wine-Rd seed
      # corridor + the 7 target Kinetic markets (Harrisburg/Monroe/Albemarle/Oakboro/
      # Indian Trail/Concord/Rockwell) via the real startTargetRun path. Self-limiting;
      # set to "off" once the corridor + markets are well-covered.
      SEED_PRIORITY_SCAN: "off"
      # One-burst-per-24h: re-check legacy "green" targets that lack an authoritative
      # conclusive NEW-FIBER+N snapshot so they become real assignable pins. Runs as
      # MAINTENANCE-class recheck (share-capped; never crowds revenue checks).
      GREEN_REVERIFY: "on"
      # Rumor-driven territory probes (bounded city sweeps, MAINTENANCE class,
      # idempotent per city, 2 starts/15min tick — see server/exploreCities.ts).
      # Durham tip 2026-07-18: research (directory + Uniti build reports + ILEC/OCN
      # records + FCC data) says Durham's ring is Frontier/AT&T/Brightspeed, NOT
      # Kinetic; the nearest real Kinetic fiber is the Lee County corridor
      # (Sanford/Broadway live multi-gig; Olivia/Cameron exchanges) plus the SW
      # Chatham CAB build (Bear Creek/Goldston, 1,037 locations, due Oct 2026).
      # Corridor first; Durham-ring probes after, to prove the rumor with our own
      # scanner verdicts rather than aggregator listings.
      # Kinetic-only corridor. The Durham-ring probes (durham/chapel hill/
      # hillsborough/creedmoor/butner/roxboro/oxford/mebane/pittsboro/wake forest)
      # were REMOVED after the research verdict: they are Frontier/AT&T/Brightspeed
      # ILEC territory, not Kinetic — every full-city OSM harvest there (Hillsborough
      # alone pulled 37,924 addresses) was pure proxy + event-loop cost with zero
      # Kinetic yield, and the giant synchronous upserts destabilized the 1-CPU box.
      # 2026-08-09 PORTAL-FIRST STOP: was "davidson:nc".
      EXPLORE_CITIES: ""
      # "Right away" corridor scan (user 2026-07-18): DISCOVERY-class runs over
      # EXISTING stale targets, 2 min after boot — no harvest wait. Explore above
      # still harvests the never-enumerated towns (olivia has zero targets).
      PRIORITY_CITIES: "broadway:nc,lexington:nc,sanford:nc,concord:nc,kannapolis:nc,salisbury:nc,rockwell:nc,davidson:nc,cornelius:nc,huntersville:nc,mooresville:nc,china grove:nc,landis:nc"
      # ── Copper-switch watch (2026-07-18) ─────────────────────────────────
      # Legacy Kinetic ILEC copper towns re-sweep every 72h (was 336h) so a
      # copper→fiber switch-on is caught within days, not weeks; SW-Chatham CAB
      # towns (bear creek/goldston/moncure — funded build due Oct 2026) run at
      # 24h with a score boost via the catalog.
      COPPER_WATCH_HOURS: "72"
      # Coming-Soon rechecks at DOUBLE frequency (hot 6→3h, construction
      # 12→6h, watch 24→12h) + funded-expansion cities always hot.
      COMING_SOON_HOT_HOURS: "3"
      COMING_SOON_CONSTRUCTION_HOURS: "6"
      COMING_SOON_WATCH_HOURS: "12"
      COMING_SOON_HOT_CITIES: "bear creek:nc,goldston:nc,moncure:nc"
      # ── Concurrency tuned to the THROUGHPUT PLATEAU, not a rate limit ────────
      # At the raised default (100 concurrent checks) Node's single thread saturated
      # on synchronous SQLite work: per-check latency inflated ~10x (to ~30s),
      # throughput plateaued (~137/min), and the HTTP server starved — /api/health
      # timed out for minutes and reps could not load the app at all (observed live,
      # container flapping unhealthy). SQLite is single-writer and Decodo RTT
      # dominates, so parallelism beyond the plateau adds latency, not leads.
      # 64/32 keeps the scanner at full speed AND the app responsive. If observed
      # searches/5m drops below the 100-concurrency baseline, raise these — never
      # add per-minute rate caps.
      # Tuned for the app's SINGLE event-loop thread (Node), NOT total cores. The
      # box is now 4 vCPU/8GB (upgraded 2026-07-18), which keeps Caddy + OS + the
      # healthcheck responsive — but the app's JS scanning work still runs on ONE
      # thread, so concurrency must stay at a level that thread can sustain while
      # also serving /api. 64/32 saturated that one thread under a 403 storm and
      # wedged the app (portal unreachable) even on 4 cores. 20/10 scans hard yet
      # leaves the loop headroom to answer HTTP. Raise only if searches/5m drops
      # AND the app stays healthy under load — never blindly.
      # ── MULTI-CORE SCAN CLUSTER ──────────────────────────────────────────────
      # Fork N worker processes so scanning uses every core (the scan pipeline is
      # single-threaded JS and pegged ONE of the 4 cores at ~100% while the other 3
      # idled). "auto" = ALL vCPUs deliberately (see scanWorkers.ts, the one parser):
      # the supervisor primary is near-idle, Caddy uses <1% of a core, and every
      # worker serves HTTP, so there is no single event loop to protect — per-worker
      # resume stagger (25s × worker index) keeps their heavy bursts from aligning.
      # The DB-coordinated provider admission caps TOTAL Decodo concurrency globally
      # across all workers (SCAN_GLOBAL_CONCURRENCY is a global cap, not per-process),
      # so more workers do NOT multiply proxy pressure — they parallelize the CPU-bound
      # parse/classify/DB work up to that global cap. SCAN_WORKERS=0 (or unset) = the
      # single-process kill-switch (byte-for-byte the pre-cluster behavior).
      # ACTIVE at "auto" (= vCPUs detected at boot via availableParallelism, so a box
      # resize rescales the cluster with no config change). The first activation
      # (2026-07-19, SCAN_WORKERS=3) deadlocked steady-state admission: the
      # coordinator's head-of-line admit assumed the head row's OWN submitter keeps
      # polling — dead/starved submitter → everyone waits behind it (11/20 frozen,
      # checks→0). FIXED in code: TOP-K SELF-ADMISSION (a poller admits itself when it
      # ranks within the free slots under its own class ceiling — see
      # distributedProviderCoordinator.ts). Token warm pool now divides across workers
      # (scanner.ts) so N workers can't mint-storm Decodo at boot. Kill-switch:
      # SCAN_WORKERS=0 = single-process, byte-for-byte pre-cluster behavior.
      SCAN_WORKERS: "auto"
      # GLOBAL Decodo-side cap (DB-enforced across every worker — not per-process).
      # 20 was the proven single-thread plateau; with the cluster spreading the
      # CPU-bound parse/classify/DB work across all cores, 24 gives the extra cores
      # work without a step-change in proxy pressure (Decodo showed 1% 403s at 20).
      # Raise further only if 403s stay low AND the portal stays snappy.
      # 2026-07-30 (62e0275) cut this 6 -> 1 as quiet-mode pacing while the
      # Kinetic origin bot-gate was total, "revert when the gate relaxes". No
      # later commit recorded the gate relaxing, and with every producer off
      # nothing has exercised it since 2026-08-12.
      # 2026-08-22 NEIGHBORHOOD SWEEP RAMP, rung 1: back to the pre-quiet 6.
      # Consumption now lives on the control worker only (SCAN_CONSUME_ROLE),
      # so this is provider pressure, not request-loop pressure. Watch
      # scan.fleet.heartbeat (breaker, blocked share) and the provider_blocked
      # share of scan_run_targets for a full cycle; if blocked > ~10%, set it
      # back to 1 (no code change needed). Next rungs: 12, then 20 (the proven
      # single-thread plateau), each only after a clean cycle at the previous.
      SCAN_GLOBAL_CONCURRENCY: "6"
      SCAN_BATCH_CONCURRENCY: "3"
      # Cap concurrently-EXECUTING scan-run worker loops PER PROCESS (each loop polls
      # the DB via a synchronous better-sqlite3 claim). 6/worker × 4 workers = up to 24
      # run loops box-wide, matching the global concurrency cap.
      MAX_ACTIVE_RUN_WORKERS: "6"
      # Only the control worker (no HTTP) consumes scan runs: resume passes, the
      # 60 s reaper and the run loops it dispatches. Measured 2026-08-22 with the
      # slow-statement log, 15 min after a deploy: every HTTP worker's reaper tick
      # took 10 to 30 s and the run loops' write transactions queued on the single
      # SQLite write lock (BEGIN IMMEDIATE 430 times, 571 s total, up to 15 s each)
      # ON the request loops. With SCAN_GLOBAL_CONCURRENCY=1 the extra processes
      # bought no throughput. "all" restores consumption in every worker.
      SCAN_CONSUME_ROLE: "control"
      # ── TEMPORARY: heavy background PRODUCERS paused to keep the portal up ────
      # The single JS thread silently pegs at ~100% and starves /api (portal 000,
      # Docker unhealthy, no log output, probe can't even fork) ~150s after every
      # boot — when the deferred resume + the statewide sweep (harvesting tens of
      # thousands of OSM addresses in synchronous better-sqlite3 bursts) + the other
      # producers all fire against the accumulated backlog (193 'running' runs, 280k+
      # queued targets). Lowering scan concurrency did NOT help (the producers, not the
      # searches, are the load). A reliable portal for reps outranks proactive scanning,
      # so pause the producers that generate the heavy synchronous bursts. On-demand
      # scans (rep taps, lasso, manual) still work, and the reaper still drains the
      # existing backlog gently at concurrency 10. RE-ENABLE once true multi-core is
      # live (gives HTTP its own core) OR the backlog/running-run pileup is drained.
      # (SEED_PRIORITY_SCAN, ENABLE_STATE_MONITORING, EXPLORE_CITIES, PRIORITY_CITIES
      #  are set to their off/empty values at their original definitions above.)
      # RESUME RESTORED (150s, past the 120s health start_period). The 2026-07-19
      # wedge turned out to be the state-monitor alert-outbox spin (1.25M pending rows
      # drained against a dead mail quota) — NOT the resume; that root cause is now
      # triple-guarded in code (enqueue cap + delivery circuit breaker + boot janitor
      # pruning the backlog, see stateMonitorScheduler.ts). With the cluster live, the
      # resume+reaper run in EVERY worker: all cores chew the accumulated run backlog
      # in parallel (atomic claims + finalize CAS + the decoupled run heartbeat make
      # that safe), and HTTP stays served because no single event loop is the only one.
      BACKGROUND_RESUME_DELAY_MS: "150000"
      # BOOT-TIME DB jobs re-enabled AND made boot-safe (2026-07-19): both were heavy
      # synchronous better-sqlite3 sweeps that stalled the control worker at boot. Now:
      # (a) both are deferred past the 150s health gate via deferBoot; (b) both yield the
      # event loop (setImmediate) between chunks; (c) idx_scan_targets_green_unlinked
      # covers the FRESH_LEAD green predicate so it no longer full-scans scan_targets;
      # (d) finalizeAddressNotFoundBacklog is async + chunk-yielding. ANF_BACKFILL
      # terminalizes the exhausted needs-fix tail (the ~81%-of-checks churn);
      # FRESH_LEAD_BOOT_BACKFILL promotes existing greens straight to the map.
      FRESH_LEAD_BOOT_BACKFILL: "on"
      ANF_BACKFILL: "off"
      # ── GA / SC FEEDER ROLLOUT (partial: light feeders ON, heavy ones staged) ──
      # These producers put GA/SC addresses INTO scan_targets. Paused during the
      # single-thread era (they peg the one JS thread and starve /api); multi-core
      # (SCAN_WORKERS=auto, live on a $74 multi-core Hetzner box) now gives HTTP its
      # own cores. Enabling the two LIGHT, governed feeders now to get GA/SC leads
      # flowing; keeping the two HEAVY / incident-linked ones OFF until the live box
      # confirms the cluster forks >1 worker.
      #
      # ON NOW (bounded + self-throttled — adaptivePace backs off on /api latency,
      # bandwidth governor caps Decodo spend, SCAN_GLOBAL_CONCURRENCY caps overlap):
      #   • HOT_MARKETS below — per-city discovery+scan, 5000-target cap, 20-min
      #     cadence. dalton:ga is the GA build zone; SC fiber markets added.
      #   • DAILY_MARKET_REFRESH=on — daily new-address discovery for eligible cities.
      #
      # STILL OFF (highest portal risk — flip only AFTER the live checks below pass):
      #   • STATEWIDE_SCAN_ON_DEPLOY — tens of thousands of synchronous OSM addresses
      #     on boot; the single biggest wedge risk. Enable LAST.
      #   • ENABLE_STATE_MONITORING — the literal 2026-07-19 outbox wedge; enable only
      #     after confirming its cap + circuit-breaker + janitor fix holds and mail
      #     quota is sorted (see top of this file / stateMonitorScheduler.ts).
      #
      # LIVE CHECKS before flipping the two heavy ones (this config can't prove them):
      #   1. Launch path IS this compose (docker compose ps, not systemd — the
      #      DEPLOY_HETZNER.md bare-metal path never sets SCAN_WORKERS → 1 core).
      #   2. Cluster forked >1 worker: grep cluster.primary_started in logs
      #      (workers/vcpus fields) AND nproc > 1.
      #   3. Portal stays snappy under scan load (/api/health latency, adaptivePace
      #      paceMs/loopLagP95). If it doesn't, flip HOT_MARKETS/DAILY_MARKET_REFRESH
      #      back to off — that is the kill-switch, no redeploy of code needed.
      STATEWIDE_SCAN_ON_DEPLOY: "off"
      # ── PORTAL-FIRST STOP (operator, 2026-08-09) ─────────────────────────────
      # EVERY automatic scan/harvest/discovery PRODUCER is off. Measured on the
      # live box: app container at ~280% CPU on producer work, event loops
      # blocking 2–17s on trivial requests (9/20 then 2/12 health probes >1s),
      # dashboard endpoints 3.6–7.2s, and the WAL pinned at 1.9 GB because
      # producer read marks starve wal_checkpoint(TRUNCATE) 35×/77min. Reps
      # could not use the portal during bursts. A responsive portal outranks
      # proactive lead-gen — perf-report run 31294218526 is the evidence base.
      #
      # STILL RUNNING (deliberately): the scan-run reaper/resume CONSUMERS
      # (execute rep-initiated on-demand scans + drain the existing queue at
      # SCAN_GLOBAL_CONCURRENCY, currently 1), FRESH_LEAD_BOOT_BACKFILL (one-
      # shot, chunk-yielding green→map promotion at boot), and yield-rollup
      # maintenance (cluster primary only — it FIXES the WAL-pinning query).
      #
      # RE-ENABLE one producer at a time, watching /api/health p95 and
      # perf.loop_lag for a full cycle before the next; HOT_MARKETS and
      # FRESH_HARVEST were the heaviest and go LAST — and only after scanning
      # moves off the HTTP workers (dedicated worker service / core pinning).
      #
      # The switches themselves: HOT_MARKETS + BUILD_INTEL + FRESH_HARVEST +
      # EXPLORE_CITIES are set at their definitions below in this section;
      # COMING_SOON_PROGRAM / COMING_SOON_WATCHLIST / DAILY_MARKET_REFRESH /
      # NEWBUILD_RADAR / EXPANSION_ENABLED live in the 2026-07-21 full-coverage
      # block near the bottom (YAML keeps the LAST duplicate key — flip them
      # there, never redeclare here). KEEPWARM_SCAN is only defined here:
      KEEPWARM_SCAN: "off"
      # HOT ZONE (20-min bursts + hourly address discovery per city).
      # NC additions (operator, 2026-07-21): the Lee-corridor pair (Broadway +
      # Sanford — live multi-gig builds), the Rowan/"Rockwell area" cluster
      # (Rockwell, Salisbury, Granite Quarry, Gold Hill, Faith, China Grove,
      # Landis), and the Cabarrus build zone (Concord + Kannapolis). Granite
      # Quarry/Concord/Kannapolis are verified_expanding in the market catalog
      # (Q4-2025/Q1-2026 official build releases). Spend stays bounded: the
      # bursts only claim due targets (30-min stale window) and the bandwidth
      # governor + SCAN_GLOBAL_CONCURRENCY cap total Decodo pressure.
      # NOTE: build-intel (below) UNIONS news/permit-promoted cities into this
      # list dynamically — env entries are the always-on floor, not the ceiling.
      # SC focus (operator, 2026-07-21): ALL nine carrier-listed SC fiber
      # markets are hot — the Spartanburg-county cluster (Inman + Campobello +
      # Landrum + Spartanburg), the Columbia pair (West Columbia + Lexington),
      # and Kershaw / Cameron / Saint Matthews. cameron:sc (Calhoun Co) is
      # distinct from the NC Cameron; the burst keys every city by (city, state).
      # lexington:nc (Davidson Co — verified_expanding, Q4-2025 + Q1-2026 build
      # releases) is distinct from lexington:sc above; both are hot.
      # 2026-08-09 PORTAL-FIRST STOP: was the 12-city NC list above + SC markets.
      # The bursts hammered the exact cities reps work (Concord/Kannapolis/
      # Salisbury/China Grove/Landis) every 20 min from inside the HTTP workers.
      HOT_MARKETS: "off"
      # BUILD INTELLIGENCE — news + county-permit signals auto-promote cities
      # into the hot zone (TTL'd, evidence-logged). Official Windstream release
      # naming a city → immediate promotion; ≥2 independent news articles/30d →
      # promotion; permit surge (≥BUILD_INTEL_PERMIT_MIN in 30d) → promotion.
      # Free public sources (Google News RSS + optional ArcGIS county permit
      # feeds via BUILD_INTEL_PERMIT_FEEDS JSON) — zero proxy spend. This is the
      # "know where they're building before the first drop lights" feed.
      # 2026-08-09 PORTAL-FIRST STOP: off — its only consumer (hot-market
      # promotion) is off, so the RSS/permit polling would spin for nothing.
      BUILD_INTEL: "off"
      # NEIGHBORHOOD SWEEP (2026-08-22) — the one producer re-enabled after the
      # portal-first stop, and the only one that runs now. It finishes whole
      # neighborhoods: re-confirms known NEW FIBER doors that never became
      # leads, floods every ~1 km cell that has produced a hit (all of its
      # doors, street by street, plus its due negatives), probes cold cells one
      # address per street, and parks proven sinks (Charlotte, Statesville).
      # Control worker only, deterministic run ids, sized each cycle to the
      # measured drain so the queue stays short. It also cancels the stale
      # bulk runs (daily-diff / hot_market) whose 776k queued rows were the
      # "one random door at a time" scatter. Kill-switch: "off" (no redeploy of
      # code needed). Knobs below are the documented defaults, listed so the
      # next person can see them. See docs/SCAN_OPERATIONS.md, "Neighborhood sweep".
      NEIGHBORHOOD_SWEEP: "on"
      NEIGHBORHOOD_SWEEP_STATE: "NC"
      NEIGHBORHOOD_SWEEP_INTERVAL_MIN: "10"
      NEIGHBORHOOD_SWEEP_FLOOR: "600"
      NEIGHBORHOOD_SWEEP_MAX_PER_CYCLE: "6000"
      NEIGHBORHOOD_SWEEP_PROBE_FRACTION: "0.25"
      NEIGHBORHOOD_SWEEP_CONFIRM_FRACTION: "0.4"
      NEIGHBORHOOD_SWEEP_CONFIRM_PER_CYCLE: "600"
      NEIGHBORHOOD_SWEEP_CONFIRM_MAX_ATTEMPTS: "3"
      NEIGHBORHOOD_SWEEP_NEG_RECHECK_DAYS: "21"
      NEIGHBORHOOD_SWEEP_MAX_FLOOD_RUNS: "12"
      # ONCE ONLY (2026-08-22). An address with a conclusive answer is never
      # bought again by a bulk producer; enforced in claimRunTargets so no
      # producer can bypass it. Measured: 55,503 of 78,058 NC Kinetic checks
      # (71%) were repeats and returned zero Kinetic fiber, while 311,933 doors
      # have never been checked once. Rep taps and the coming ledger are exempt.
      # SCAN_ONCE_ONLY=off restores the old 18h window; RESCAN_NEGATIVES=on
      # restores the flip watch. Neither needs a code change.
      SCAN_ONCE_ONLY: "on"
      NEIGHBORHOOD_SWEEP_RESCAN_NEGATIVES: "off"
      # Where the sweep starts, in order. Every tier sorts these first.
      NEIGHBORHOOD_SWEEP_SEED_CITIES: "broadway,wingate,rockwell"
      # Street completion: unscanned doors on streets that already produced
      # fiber. 264 of 403 such NC streets came back 100% NEW FIBER.
      NEIGHBORHOOD_SWEEP_STREET_PER_CYCLE: "1500"
      # The coming ledger: collect on provider-stated turn-on dates. Kinetic
      # sends broadbandService.estimatedCompletionDt ("NOV-2026"), Frontier
      # sends futureServiceDate. Backfilled once per process from bodies we
      # already paid for (measured: 1,327 doors, 525 dated, zero new spend).
      NEIGHBORHOOD_SWEEP_COMING_PER_CYCLE: "300"
      NEIGHBORHOOD_SWEEP_BACKFILL_LIMIT: "50000"
      # An undated "Future Fiber Build Planned" is months out: re-read monthly,
      # not daily. Daily polling of the undated population would cost ~24,000
      # checks/month, more than the once-only law saves.
      COMING_LEDGER_UNDATED_DAYS: "30"
      # Planner statistics upkeep, on SQLite's documented lifecycle: ANALYZE used
      # to run once and never again, so sqlite_stat1 held stats for a single
      # scan_targets index with the value "0 0 0 0" and the planner walked 919k
      # rows for a count the range index answers immediately. The maintenance
      # tick now runs PRAGMA optimize=0x10002 (the mask that lifts the
      # "only tables this connection queried" restriction) once per process and
      # once a day thereafter, then plain PRAGMA optimize on every other tick.
      # Measured: 13.8 s for the first pass, 0-5 ms after; sweepSummary 2,951 ms
      # -> 12 ms. Cluster primary only, never at open. "off" disables.
      ANALYZE_MAX_AGE_HOURS: "24"
      # FRESH HARVEST — continuous Kinetic scanning ranked by expected yield
      # (coming-soon flips → fresh-cluster neighbors → hot-city frontier →
      # stale re-checks). Self-throttled by ADAPTIVE_PACE against live website
      # health, so it runs 24/7 with zero site impact. off to disable.
      # 2026-08-09 PORTAL-FIRST STOP: pinned hard off (was "${FRESH_HARVEST:-on}",
      # host-.env-overridable, and running in PUMP MODE — 20k budget / 5 min).
      # The pin supersedes the .env lever on purpose: compose is the single
      # source of truth for this state; re-enable happens here, in a commit.
      FRESH_HARVEST: "off"
      # PUMP MODE: 2x harvest budget (8k/10min) and the keep-warm feeder tops up
      # harder so the queue never drains.
      FRESH_HARVEST_BUDGET: "20000"
      FRESH_HARVEST_INTERVAL_MIN: "5"
      KEEPWARM_REFILL: "30000"
      KEEPWARM_PER_CITY: "3000"
      # REACH FURTHER (operator, 2026-07-21: "keep reaching and removing
      # limitations"). Under the unlimited Decodo plan, breadth is free, so the
      # coverage caps are loosened. These redistribute the SAME governed
      # throughput (SCAN_GLOBAL_CONCURRENCY still bounds Decodo pressure and the
      # single-thread load) — they do NOT raise concurrency, so there is no
      # thread-wedge risk; the app-health knobs are untouched.
      #   • FRESH_HARVEST_BUDGET 4000→8000 — set above with PUMP mode; more
      #     inventory selected per cycle, so more never-scanned addresses enter
      #     flight each pass.
      #   • YIELD_EXPLORE_FRACTION 0.15→0.25 — spend a quarter of each cycle on
      #     never-scanned footprint discovery → full coverage of enumerated
      #     inventory reached faster.
      #   • NEG_RECHECK_MAX_DAYS 60→21 — nothing sleeps more than 3 weeks, so a
      #     copper→fiber flip on even a chronic-dead address is caught within 21d
      #     everywhere (the flip-proximity override still catches neighbours in
      #     hours; verified_expanding markets keep their 7d floor).
      YIELD_EXPLORE_FRACTION: "0.25"
      NEG_RECHECK_MAX_DAYS: "21"
      # Cluster expansion reaches further from every confirmed drop: more rings
      # (6→10, ~5km radius) and one extra tolerance for an empty ring before it
      # stops (2→3). Still bounded by maxActive×ringBudget offered load + the
      # global provider-slot ceiling — no concurrency increase.
      EXPANSION_MAX_RINGS: "10"
      EXPANSION_MAX_EMPTY_RINGS: "3"
      # MAPBOX SPEND GOVERNOR — the hard ceiling that neutralizes the "real-dollar
      # runaway" risk. Mapbox geocoding is separately METERED (unlike the
      # unlimited Decodo plan) and has a documented runaway-cost history, so a
      # persistent daily/monthly request budget bounds spend REGARDLESS of how
      # dense any scan's grid is. When the ceiling is hit, paid calls stop and the
      # scan falls back to the free OSM enumeration — never a billing surprise.
      # This is what makes the per-box grid caps safe to raise. 0 = unlimited.
      MAPBOX_DAILY_REQUEST_CAP: "100000"
      MAPBOX_MONTHLY_REQUEST_CAP: "2000000"
      # Now that SPEND is governed above, the elected-box grid caps can be
      # generous (denser scans of a drawn area) without billing risk — the daily
      # ceiling is the real limit, not these per-box counts.
      AREA_ELECTED_GRID_POINTS: "16000"
      MAPBOX_ELECTED_HARVEST_CAP: "20000"
      # SQLite write contention: the scan firehose + boot resume storms can
      # hold the write lock well past the 15s default, crashing workers with
      # SQLITE_BUSY. 120s matches the resilience of our ops scripts.
      SQLITE_BUSY_TIMEOUT_MS: "120000"
      HF_ROLE: "control"
      # UNLIMITED DECODO PLAN (operator, 2026-07-21): the plan is metered as
      # unlimited, so budget pacing NEVER throttles down and an auth/limit-denial
      # (407) burst does NOT freeze scanning. Instead the governor rotates to a
      # fresh residential IP set (single-flight, rate-limited) and keeps making
      # requests — fresh IPs are free; only a throttled IP costs us. This makes
      # scanning truly uninterrupted. The budget vars below are left for the
      # economy report / diagnostics only; they no longer gate throughput.
      DECODO_UNLIMITED: "on"
      # BANDWIDTH GOVERNOR — reporting only while DECODO_UNLIMITED=on.
      DECODO_BUDGET_GB: "25"
      DECODO_RESERVE_PCT: "10"
      DECODO_BILLING_DAY: "1"
      YIELD_ROLLUPS: "off"
      # Query planner statistics run on their OWN timer, not inside the rollup
      # tick that YIELD_ROLLUPS=off disables - sqlite_stat1 going stale is what
      # makes the planner walk 919k rows for counts an index answers at once.
      # ANALYZE_MAINTENANCE=off is its kill switch.
      ANALYZE_TICK_MS: "300000"
      # TOKEN ECONOMY (bot-wall workaround): mint rarely, ride tokens long.
      # 1 mint/2s max; each token serves 40 leases / 1000 checks before
      # retirement. One success per minute = 1000 checks/min of capacity.
      KFS_MINT_MIN_INTERVAL_MS: "15000"
      # DECODO STICKY EGRESS - ON, and by PORT (measured 2026-08-22).
      # Decodo does sticky through the port, not a username suffix:
      # us.decodo.com:10000 hands out a DIFFERENT residential IP on every
      # request and REJECTS every session-suffix form outright, which is why
      # this was "off" - switching it on used to break every request.
      # 10001+ each hold one persistent IP.
      # This matters because a Kinetic bearer token is bound to the IP that
      # minted it, so mint-here/search-there is a guaranteed 403. Measured end
      # to end on Rockwell doors: port 10000 gave 31 of 236 checks (13%, 205
      # denials); port 10001 gave 69 of 80 (86%), longest clean streak 30.
      # PROXY_URL keeps its :10000 - the port is rewritten per sticky session.
      DECODO_STICKY: "on"
      DECODO_STICKY_PORT_BASE: "10001"
      # 10,000 sticky ports = 10,000 distinct residential IPs. Probed across the
      # range 10001-24999 (10001, 10100, 10500, 10999, 11000, 11500, 12000,
      # 19999, 20000, 24999): every one open, every one a different IP, so the
      # ceiling is far above what is configured here.
      # At 20 checks per IP that is 200,000 checks before any IP is revisited -
      # more than the 167,679 never-scanned doors in NC cities that have already
      # produced fiber. We never have to reuse a spent address.
      # (One observation: port 11000 answered on IPv6. Harmless for a sticky
      # session, but worth knowing if Kinetic ever treats v6 differently.)
      DECODO_STICKY_PORT_COUNT: "10000"
      DECODO_STICKY_MINUTES: "15"
      # One 403 does not mean the IP is burnt (the 86% run took its first at
      # check 15, then ran 30 clean). Rotating on the first denial is what
      # turned 205 denials into 205 IP rotations.
      # Set HIGH deliberately. Changing egress IP mid-run is the thing that
      # correlates with collapse: the one clean local run that never changed IP
      # held 86% over 80 checks, while runs that rotated freely fell to 13%.
      # A denial is a reason to slow down, not to move house. Time-based
      # refresh (DECODO_STICKY_MINUTES) still cycles IPs in an orderly way.
      DECODO_ROTATE_AFTER_DENIALS: "8"
      # Retire each residential IP after 20 checks, while it is still healthy.
      # Measured across five sticky ports driven to exhaustion: the longest
      # clean streak was 20/20/20/21/30, and every IP that died had delivered
      # ~30 successes first (30/30/30/36). Taking that last third costs 13-18
      # denials to get ten answers - 63-73% efficiency - and each denial feeds
      # the fleet-shared 403-storm backoff. 20 stays inside the clean run.
      DECODO_CHECKS_PER_IP: "20"
      KFS_USER_AGENT: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1"
      KFS_TOKEN_MAX_LEASES_PER_SLOT: "40"
      KFS_TOKEN_MAX_CHECKS: "1000"
      SCAN_TARGET_MERGE: "off"
      # ── Heavy-migration gates — BOTH required to keep the app off the
      # scan_targets table rebuild (949k rows) that wedged the event loop twice.
      # The rebuild runs in TWO places: the boot-time call (gated here by
      # DEFER_ADDR_UNIQUENESS_MIGRATION=on) AND the post-listen deferred call
      # (gated by DEFERRED_MIGRATIONS=off). Setting only one leaves the other
      # path live. Run the rebuild OUT OF BAND in a maintenance window via the
      # offline dedup script; never on boot. ──
      DEFER_ADDR_UNIQUENESS_MIGRATION: "on"
      DEFERRED_MIGRATIONS: "off"
      ADAPTIVE_PACE: "off"   # NIGHT BLITZ: owner says app may be down — all resources to scanning
      FRONTIER_BUILD_ZONES: "off"
      # ── PORTAL-FIRST STOP, second pass (2026-08-13) ──────────────────────
      # CITY_INGEST was the ELEVENTH producer, and it was still on. The
      # 2026-08-09 stop turned off ten switches and the file has said "every
      # producer is off" ever since, but this one was never in that inventory:
      # it schedules a first pass at boot+5min and then a daily OSM harvest
      # across the 22 cities listed below, and upsertScanTargets takes the
      # write lock for a whole Overpass tile in ONE unchunked IMMEDIATE
      # transaction - a dense tile is a multi-second exclusive write on the
      # same 18.8GB file the field map reads from. That is precisely the shape
      # the stop existed to eliminate.
      # Priority build cities: OSM-ingested daily (free), always scanned first
      # in every harvest cycle. Davidson + Lake Norman towns.
      CITY_INGEST: "off"
      # Both of these are NESTED producers that default ON (`!== "off"`), so
      # they are dark today only because their PARENT is off - YIELD_ENGINE
      # inside FRESH_HARVEST, YIELD_THROUGHPUT_MATCH inside KEEPWARM_SCAN.
      # Pinned explicitly so the documented "re-enable one producer at a time,
      # watching /api/health p95" protocol actually holds: without this,
      # flipping FRESH_HARVEST back on silently restarts the yield engine in
      # the same breath, which is two producers, not one.
      YIELD_ENGINE: "off"
      YIELD_THROUGHPUT_MATCH: "off"
      FRESH_HARVEST_CITIES: "campobello:sc,landrum:sc,lexington:sc,albemarle:nc,broadway:nc,concord:nc,kannapolis:nc,harrisburg:nc,indian trail:nc,granite quarry:nc,hemby bridge:nc,morven:nc,pine bluff:nc,sanford:nc,tryon:nc,wingate:nc,norwood:nc,oakboro:nc,locust:nc,stanfield:nc,lexington:nc,davidson:nc"
      # States the PRIMARY yield-engine harvester scans (FOCUS_STATES). Was the
      # code default "nc,sc" — which fenced GA out of ALL the smart tiers (cluster
      # neighbours, street completion, expansion push/flip, momentum, copper watch,
      # stale refresh, the 15% explore). GA now gets parity. Low risk: the
      # footprint gate still limits GA scanning to auto_scan_eligible GA markets
      # (Dalton + legacy watch), and the bandwidth governor + SCAN_GLOBAL_CONCURRENCY
      # cap bound total spend regardless of state count. GA only produces work once
      # GA inventory exists in scan_targets (see the GA/SC FEEDER rollout below).
      # KINETIC-ONLY NC/SC (owner directive 2026-07-23): all live scanning,
      # discovery, and rechecks focus on confirmed Kinetic markets in NC + SC.
      # GA (dalton) removed from states + hot markets; frontier producers stay
      # off and frontier-carrier rows are excluded at selection (yieldEngine
      # KINETIC_ONLY) with historical records preserved suppressed.
      # NC-EXCLUSIVE background scanning (owner 2026-07-24): SC/GA producers
      # paused — data, queues, and config preserved; CRITICAL Field Map/manual
      # scans remain available everywhere (never state-gated).
      FRESH_HARVEST_STATES: "nc,sc"
      FRONTIER_DIRECT: "off"
      FRONTIER_MARKETS: "off"
      # FULL SCAN (operator, 2026-07-21) — every safe coverage producer ON so we
      # scan the entire Kinetic-serviceable surface continuously:
      #   • COMING_SOON_WATCHLIST — the tight-cadence flip engine: coming-soon
      #     addresses recheck at the configured 3h/6h/12h (hot/construction/
      #     watch) under reserved coming_soon capacity, so a go-live is caught in
      #     hours, not the ~18h yield floor. Governor-paced + circuit-broken; no
      #     wedge risk flagged.
      #   • COMING_SOON_PROGRAM — legacy→watchlist bridge + promotion board.
      #   • NEWBUILD_RADAR — authoritative NEW-address discovery across ALL 100
      #     NC counties (OneMap) + SC E911/GIS + OSM `newer:`, feeding fresh
      #     rooftops straight into the pipeline. Free gov sources, incremental
      #     (not a boot burst), control-worker only. De-nested from the statewide
      #     gate in code, so this flag works on its own.
      # Together with the full-footprint yield engine (132 markets), daily
      # refresh, hot zone, build-intel promotion, and cluster expansion, this is
      # full coverage of everything Kinetic can light up. The ONE lever still off
      # is STATEWIDE_SCAN_ON_DEPLOY (every address statewide incl. non-Kinetic
      # territory) — the documented boot-wedge risk; flip that only after the
      # live checks above pass.
      # 2026-08-09 PORTAL-FIRST STOP (see the block above STATEWIDE_SCAN_ON_
      # DEPLOY): all four were "on" (operator, 2026-07-21 full-coverage push).
      # These are the canonical switch lines — YAML keeps the LAST duplicate
      # key, so producer switches must be flipped HERE, never redeclared above.
      COMING_SOON_PROGRAM: "off"
      COMING_SOON_WATCHLIST: "off"
      DAILY_MARKET_REFRESH: "off"
      NEWBUILD_RADAR: "off"
      # CLUSTER EXPANSION — ON (operator, 2026-07-21: "if we found new builds
      # the surrounding is turned on"). Every confirmed NEW FIBER + billing-N
      # result seeds a bounded ring crawl around the drop (800m rings, <=6
      # rings, 60 addr/ring, 600/cluster, <=8 concurrent clusters, generation
      # backpressure at 25k pending, city-boundary stop) — the street-level
      # "surrounding turns on". The city-level counterpart is build-intel's
      # fresh-drop promotion (>=3 drops/14d -> whole city into the hot zone).
      # De-nested from STATEWIDE_SCAN_ON_DEPLOY in code, so this flag works
      # without the statewide boot sweep.
      # 2026-08-09 PORTAL-FIRST STOP: off (was "on", operator 2026-07-21).
      EXPANSION_ENABLED: "off"
      # Proactive Decodo rotation cadence. 10 was too aggressive: under a 403
      # rolling-window storm it rotated the session hundreds of times/sec (runaway
      # CPU). 40 is the previously-proven value — 403s are a refilling throttle, so
      # pace, don't rotate harder. Reactive on-403 rotation still catches the rest.
      PROXY_ROTATE_EVERY: "40"
      # 403-storm back-off: pause a worker when ≥40% of a batch is blocked, up to
      # 20s — frees the single thread during Decodo's rolling-window throttle so
      # /api stays responsive and the window can refill.
      PROVIDER_BLOCK_BACKOFF_FRACTION: "0.4"
      PROVIDER_BLOCK_BACKOFF_MS: "20000"
      # ── Outbound mail sender (2026-07-16 OTP outage) ─────────────────────────
      # The Resend account has exactly ONE verified sending domain:
      # portal.homefrontsolutionsllc.com. The host .env pointed MAIL_FROM at the
      # UNVERIFIED apex domain, so Resend rejected every send (403 "domain is
      # not verified") and OTP login died. Pin the sender to the verified
      # subdomain here — compose `environment` overrides env_file, so this wins
      # over the stale host value. If the apex is ever verified on Resend, this
      # can move back to the host .env.
      MAIL_FROM: "Home Front Solutions <noreply@portal.homefrontsolutionsllc.com>"
      # ── Nightly auto-scan (2 AM): CNS frontier + Coming-Soon recheck + pool
      #    re-scan, plus a ONE-TIME deep Mapbox-grid seed of the priority NC towns
      #    (new Kinetic fiber lands on new streets OSM lacks — Lexington had ~7,900
      #    OSM-missed addresses, ~87% fiber). Deep-seed is idempotent per town and
      #    capped, so Mapbox is a bounded one-time cost that spreads across nights.
      # Fail closed. Operations must opt in through the host's protected .env
      # after validating provider budgets and the active scan plan.
      ENABLE_NIGHTLY_SCAN: "${ENABLE_NIGHTLY_SCAN:-false}"
      # BOTH paths on the full SC+NC list ("use both"): the Mapbox address grid finds
      # the new-build streets OSM lacks (Lexington had ~7,900 OSM-missed, ~87% fiber),
      # while the OSM sweep below covers the rest for free. Deep-seed is idempotent per
      # town + hard-capped at NIGHTLY_DEEP_SEED_MAX_MAPBOX/night, so cost is bounded per
      # night and spreads across nights (big towns like Charlotte finish last). This
      # per-night cap is the guardrail against the historical uncapped-Mapbox incidents.
      NIGHTLY_DEEP_SEED_CITIES: "${NIGHTLY_DEEP_SEED_CITIES:-}"
      # FREE OSM sweep (Overpass, $0 — one cheap Mapbox bbox lookup per town only):
      # enumerate every Kinetic-served SC + NC town into the pool; the existing
      # Decodo-paced pool re-scan then qualifies them (fiber vs copper) into leads.
      # This is the "use OpenStreetMap → Kinetic via Decodo" path — no Mapbox grid.
      NIGHTLY_OSM_SWEEP_CITIES: "${NIGHTLY_OSM_SWEEP_CITIES:-}"
      # No paid Mapbox seed budget is granted by the image. Operations must set
      # an explicit non-zero nightly cap in the protected host environment.
      NIGHTLY_DEEP_SEED_MAX_MAPBOX: "${NIGHTLY_DEEP_SEED_MAX_MAPBOX:-0}"
      # Status-marker glyph pins (arrow ▲/▼, $, star…) for EVERYONE, not just admins.
      # Safe because the client fail-safe keeps the circle pins visible if the glyph
      # bitmaps ever fail to register on a device — leads are never blank. Set to
      # "off" as an instant kill-switch (reverts all users to circle pins) if needed.
      STATUS_MARKER_GLYPHS: "all"
      # FREE OSM sweep window per night (Overpass is $0). Widened 25min → 45min so more
      # towns' full address sets land per night at no Mapbox cost.
      NIGHTLY_OSM_SWEEP_MAX_MS: "${NIGHTLY_OSM_SWEEP_MAX_MS:-0}"
    volumes:
      - app-data:/data         # DB + uploads — the ONLY stateful mount
    expose:
      - "5000"                 # internal network only — NOT published to the host
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      # Timeout/retries absorb probe-fork starvation on pegged cores: the
      # probe is `node -e fetch` FORKED in-container; under deploy-time load
      # the fork itself can take >5s while the app is healthy — three deploys
      # false-failed their gates on exactly this (2026-07-23/24).
      interval: 20s
      timeout: 20s
      retries: 8
      # Production's 18.8 GB database made a known-good release take 4m48s to
      # become healthy on 2026-08-20. The former ~4m37 total gate falsely
      # rolled the new release back seconds too early. Successful probes still
      # mark the container healthy immediately during this startup period.
      start_period: 300s
    stop_grace_period: 20s     # let in-flight requests drain on redeploy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    volumes:
      # Mount the directory, not a single file. Git may replace a tracked file's
      # inode during checkout; a file-level bind mount can then keep serving the
      # old inode forever. A directory bind follows the new Caddyfile dentry, so
      # deploy.sh can validate and atomically reload the checked-out config.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data        # ACME certs + keys (persist across restarts)
      - caddy-config:/config
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  internal:
    driver: bridge

volumes:
  app-data:      # SQLite DB + user uploads (back this up — see scripts/backup.sh)
  caddy-data:    # Let's Encrypt certificates
  caddy-config:
