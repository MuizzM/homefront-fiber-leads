# ── HomeFront Fiber — production stack (Hetzner Cloud) ────────────────────────
# Two services: the app (Express serving the SPA + API, SQLite on a volume) and
# Caddy (public reverse proxy + automatic Let's Encrypt HTTPS). ONLY Caddy binds
# host ports; the app is reachable only on the internal Docker network.
#
# Usage (see docs/DEPLOYMENT.md):
#   export APP_IMAGE_TAG=$(git rev-parse --short HEAD)   # immutable tag, never :latest
#   docker compose -f docker-compose.production.yml up -d --build
#
# All secrets come from ./.env (git-ignored) — never inline them here.

services:
  app:
    # Immutable tag — deploy.sh sets APP_IMAGE_TAG to the commit SHA. Fails fast
    # if unset so nobody accidentally ships an ambiguous image.
    image: homefront-app:${APP_IMAGE_TAG:?set APP_IMAGE_TAG to the commit SHA (never :latest)}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATA_DIR: /data          # data.db + uploads/ both live here (one volume)
      # ── Opportunity-weighted cadence engine (state monitor) ──────────────────
      # Enable the built-but-dormant per-market cadence loop so verified NC/SC
      # Kinetic markets recheck on opportunity (Coming-Soon/new-build/expanding =
      # 24h, served = 168h, low = 336h) rather than only via the statewide sweep.
      # Unlimited Decodo budget → live spend on; global dedup + the coordinator
      # address-lock prevent any double-check against the sweep.
      ENABLE_STATE_MONITORING: "true"
      STATE_MONITOR_LIVE: "true"
      # One-shot-per-12h priority burst: on boot, enqueue the Sugar-and-Wine-Rd seed
      # corridor + the 7 target Kinetic markets (Harrisburg/Monroe/Albemarle/Oakboro/
      # Indian Trail/Concord/Rockwell) via the real startTargetRun path. Self-limiting;
      # set to "off" once the corridor + markets are well-covered.
      SEED_PRIORITY_SCAN: "on"
      # One-burst-per-24h: re-check legacy "green" targets that lack an authoritative
      # conclusive NEW-FIBER+N snapshot so they become real assignable pins. Runs as
      # MAINTENANCE-class recheck (share-capped; never crowds revenue checks).
      GREEN_REVERIFY: "on"
      # Rumor-driven territory probes (bounded city sweeps, MAINTENANCE class,
      # idempotent per city, 2 starts/15min tick — see server/exploreCities.ts).
      # Durham tip 2026-07-18: research (directory + Uniti build reports + ILEC/OCN
      # records + FCC data) says Durham's ring is Frontier/AT&T/Brightspeed, NOT
      # Kinetic; the nearest real Kinetic fiber is the Lee County corridor
      # (Sanford/Broadway live multi-gig; Olivia/Cameron exchanges) plus the SW
      # Chatham CAB build (Bear Creek/Goldston, 1,037 locations, due Oct 2026).
      # Corridor first; Durham-ring probes after, to prove the rumor with our own
      # scanner verdicts rather than aggregator listings.
      # Kinetic-only corridor. The Durham-ring probes (durham/chapel hill/
      # hillsborough/creedmoor/butner/roxboro/oxford/mebane/pittsboro/wake forest)
      # were REMOVED after the research verdict: they are Frontier/AT&T/Brightspeed
      # ILEC territory, not Kinetic — every full-city OSM harvest there (Hillsborough
      # alone pulled 37,924 addresses) was pure proxy + event-loop cost with zero
      # Kinetic yield, and the giant synchronous upserts destabilized the 1-CPU box.
      EXPLORE_CITIES: "broadway:nc,sanford:nc,olivia:nc,cameron:nc,bear creek:nc,goldston:nc,inman:sc,moncure:nc,dalton:ga"
      # "Right away" corridor scan (user 2026-07-18): DISCOVERY-class runs over
      # EXISTING stale targets, 2 min after boot — no harvest wait. Explore above
      # still harvests the never-enumerated towns (olivia has zero targets).
      PRIORITY_CITIES: "broadway:nc,sanford:nc,olivia:nc,cameron:nc,bear creek:nc,goldston:nc,inman:sc,moncure:nc,dalton:ga"
      # ── Copper-switch watch (2026-07-18) ─────────────────────────────────
      # Legacy Kinetic ILEC copper towns re-sweep every 72h (was 336h) so a
      # copper→fiber switch-on is caught within days, not weeks; SW-Chatham CAB
      # towns (bear creek/goldston/moncure — funded build due Oct 2026) run at
      # 24h with a score boost via the catalog.
      COPPER_WATCH_HOURS: "72"
      # Coming-Soon rechecks at DOUBLE frequency (hot 6→3h, construction
      # 12→6h, watch 24→12h) + funded-expansion cities always hot.
      COMING_SOON_HOT_HOURS: "3"
      COMING_SOON_CONSTRUCTION_HOURS: "6"
      COMING_SOON_WATCH_HOURS: "12"
      COMING_SOON_HOT_CITIES: "bear creek:nc,goldston:nc,moncure:nc,inman:sc"
      # ── Concurrency tuned to the THROUGHPUT PLATEAU, not a rate limit ────────
      # At the raised default (100 concurrent checks) Node's single thread saturated
      # on synchronous SQLite work: per-check latency inflated ~10x (to ~30s),
      # throughput plateaued (~137/min), and the HTTP server starved — /api/health
      # timed out for minutes and reps could not load the app at all (observed live,
      # container flapping unhealthy). SQLite is single-writer and Decodo RTT
      # dominates, so parallelism beyond the plateau adds latency, not leads.
      # 64/32 keeps the scanner at full speed AND the app responsive. If observed
      # searches/5m drops below the 100-concurrency baseline, raise these — never
      # add per-minute rate caps.
      # Tuned for the app's SINGLE event-loop thread (Node), NOT total cores. The
      # box is now 4 vCPU/8GB (upgraded 2026-07-18), which keeps Caddy + OS + the
      # healthcheck responsive — but the app's JS scanning work still runs on ONE
      # thread, so concurrency must stay at a level that thread can sustain while
      # also serving /api. 64/32 saturated that one thread under a 403 storm and
      # wedged the app (portal unreachable) even on 4 cores. 20/10 scans hard yet
      # leaves the loop headroom to answer HTTP. Raise only if searches/5m drops
      # AND the app stays healthy under load — never blindly.
      # ── MULTI-CORE SCAN CLUSTER ──────────────────────────────────────────────
      # Fork N worker processes so scanning uses every core (the scan pipeline is
      # single-threaded JS and pegged ONE of the 4 cores at ~100% while the other 3
      # idled). 3 (not 4) leaves a core's headroom for the supervisor primary, Caddy,
      # the OS, and HTTP responsiveness so the portal stays snappy under full scan.
      # The DB-coordinated provider admission caps TOTAL Decodo concurrency globally
      # across all workers (SCAN_GLOBAL_CONCURRENCY is a global cap, not per-process),
      # so more workers do NOT multiply proxy pressure — they parallelize the CPU-bound
      # parse/classify/DB work up to that global cap. SCAN_WORKERS=0 (or unset) = the
      # single-process kill-switch (byte-for-byte the pre-cluster behavior).
      SCAN_WORKERS: "3"
      SCAN_GLOBAL_CONCURRENCY: "20"
      SCAN_BATCH_CONCURRENCY: "10"
      # Cap concurrently-EXECUTING scan-run worker loops (each polls the DB via a
      # synchronous better-sqlite3 claim). 100+ resuming at boot pegged the loop
      # and starved /api/health. 8 keeps the loop responsive on the single thread.
      MAX_ACTIVE_RUN_WORKERS: "8"
      # Proactive Decodo rotation cadence. 10 was too aggressive: under a 403
      # rolling-window storm it rotated the session hundreds of times/sec (runaway
      # CPU). 40 is the previously-proven value — 403s are a refilling throttle, so
      # pace, don't rotate harder. Reactive on-403 rotation still catches the rest.
      PROXY_ROTATE_EVERY: "40"
      # 403-storm back-off: pause a worker when ≥40% of a batch is blocked, up to
      # 20s — frees the single thread during Decodo's rolling-window throttle so
      # /api stays responsive and the window can refill.
      PROVIDER_BLOCK_BACKOFF_FRACTION: "0.4"
      PROVIDER_BLOCK_BACKOFF_MS: "20000"
      # ── Outbound mail sender (2026-07-16 OTP outage) ─────────────────────────
      # The Resend account has exactly ONE verified sending domain:
      # portal.homefrontsolutionsllc.com. The host .env pointed MAIL_FROM at the
      # UNVERIFIED apex domain, so Resend rejected every send (403 "domain is
      # not verified") and OTP login died. Pin the sender to the verified
      # subdomain here — compose `environment` overrides env_file, so this wins
      # over the stale host value. If the apex is ever verified on Resend, this
      # can move back to the host .env.
      MAIL_FROM: "Home Front Solutions <noreply@portal.homefrontsolutionsllc.com>"
      # ── Nightly auto-scan (2 AM): CNS frontier + Coming-Soon recheck + pool
      #    re-scan, plus a ONE-TIME deep Mapbox-grid seed of the priority NC towns
      #    (new Kinetic fiber lands on new streets OSM lacks — Lexington had ~7,900
      #    OSM-missed addresses, ~87% fiber). Deep-seed is idempotent per town and
      #    capped, so Mapbox is a bounded one-time cost that spreads across nights.
      # Fail closed. Operations must opt in through the host's protected .env
      # after validating provider budgets and the active scan plan.
      ENABLE_NIGHTLY_SCAN: "${ENABLE_NIGHTLY_SCAN:-false}"
      # BOTH paths on the full SC+NC list ("use both"): the Mapbox address grid finds
      # the new-build streets OSM lacks (Lexington had ~7,900 OSM-missed, ~87% fiber),
      # while the OSM sweep below covers the rest for free. Deep-seed is idempotent per
      # town + hard-capped at NIGHTLY_DEEP_SEED_MAX_MAPBOX/night, so cost is bounded per
      # night and spreads across nights (big towns like Charlotte finish last). This
      # per-night cap is the guardrail against the historical uncapped-Mapbox incidents.
      NIGHTLY_DEEP_SEED_CITIES: "${NIGHTLY_DEEP_SEED_CITIES:-}"
      # FREE OSM sweep (Overpass, $0 — one cheap Mapbox bbox lookup per town only):
      # enumerate every Kinetic-served SC + NC town into the pool; the existing
      # Decodo-paced pool re-scan then qualifies them (fiber vs copper) into leads.
      # This is the "use OpenStreetMap → Kinetic via Decodo" path — no Mapbox grid.
      NIGHTLY_OSM_SWEEP_CITIES: "${NIGHTLY_OSM_SWEEP_CITIES:-}"
      # No paid Mapbox seed budget is granted by the image. Operations must set
      # an explicit non-zero nightly cap in the protected host environment.
      NIGHTLY_DEEP_SEED_MAX_MAPBOX: "${NIGHTLY_DEEP_SEED_MAX_MAPBOX:-0}"
      # Status-marker glyph pins (arrow ▲/▼, $, star…) for EVERYONE, not just admins.
      # Safe because the client fail-safe keeps the circle pins visible if the glyph
      # bitmaps ever fail to register on a device — leads are never blank. Set to
      # "off" as an instant kill-switch (reverts all users to circle pins) if needed.
      STATUS_MARKER_GLYPHS: "all"
      # FREE OSM sweep window per night (Overpass is $0). Widened 25min → 45min so more
      # towns' full address sets land per night at no Mapbox cost.
      NIGHTLY_OSM_SWEEP_MAX_MS: "${NIGHTLY_OSM_SWEEP_MAX_MS:-0}"
    volumes:
      - app-data:/data         # DB + uploads — the ONLY stateful mount
    expose:
      - "5000"                 # internal network only — NOT published to the host
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The server now starts listening (health OK) BEFORE the heavy background startup,
      # so it's healthy in seconds. Wide grace as a safety margin for migrations / route
      # registration on a large production DB (a 20s window previously forced a rollback).
      start_period: 120s
    stop_grace_period: 20s     # let in-flight requests drain on redeploy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # ACME certs + keys (persist across restarts)
      - caddy-config:/config
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  internal:
    driver: bridge

volumes:
  app-data:      # SQLite DB + user uploads (back this up — see scripts/backup.sh)
  caddy-data:    # Let's Encrypt certificates
  caddy-config:
